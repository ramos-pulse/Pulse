# Déploie automatiquement Pulse à chaque modification du code :
#  1. la base de données et la fonction des bots sur Supabase
#  2. l'app mobile sur GitHub Pages
name: Déployer Pulse

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  supabase:
    name: Bots (Supabase)
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Vérifier les secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Secret GitHub manquant : $v (Settings → Secrets and variables → Actions)"; exit 1; fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Relier le projet
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Base de données (tables + cron)
        # selon la version de l'outil Supabase, l'option s'appelle --remote ou --linked
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes || supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Fonction des bots
        run: supabase functions deploy pulse --no-verify-jwt --yes

  app-build:
    name: App mobile (préparation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  app:
    name: App mobile (GitHub Pages)
    needs: app-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
