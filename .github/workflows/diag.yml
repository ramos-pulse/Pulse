# Diagnostic manuel (lecture seule) : état des bots, des recherches et des réponses du cron. Aucun secret affiché.
name: Diagnostic Pulse
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.62.10
      - run: supabase link --project-ref "$PROJECT_REF" --password "$PGPASSWORD" >/dev/null 2>&1 || true
      - name: Requêtes
        run: |
          URL=$(cat supabase/.temp/pooler-url 2>/dev/null)
          [ -z "$URL" ] && URL="postgresql://postgres.$PROJECT_REF@aws-0-eu-central-1.pooler.supabase.com:5432/postgres"
          URL=$(echo "$URL" | sed 's/:\[YOUR-PASSWORD\]//')
          q() { psql "$URL" -X -A -F ' | ' -c "$1" 2>&1 | cut -c1-4000; echo; }
          q "select jsonb_pretty(config->'plans') from bot_state where kind='spot'"
          q "select kind, status, start_value_usd, goal_usd, end_at, last_value_usd from bot_state"
          q "select jsonb_pretty(price_history - 'curve' - 'brain') from bot_state where kind='perps'"
          q "select jsonb_pretty(price_history->'brain') from bot_state where kind='perps'"
          q "select now()"
          q "select max(created_at) as derniere, count(*) filter (where created_at > now() - interval '3 hours') as en_3h, count(*) as total from research"
          q "select created, status_code, timed_out, left(error_msg,150), left(regexp_replace(content::text, '\s+', ' ', 'g'), 1500) from net._http_response where content::text like '%research%' or content::text like '%watchdog%' or status_code <> 200 or timed_out order by created desc limit 8"
          q "select kind, p.key, p.value->>'symbol' as sym, p.value->>'entry' as entry, p.value->>'stop' as stop, p.value->>'target' as target, p.value->>'costUsd' as cost, p.value->'live' as live, to_timestamp((p.value->'live'->>'at')::bigint/1000) as live_at, p.value->>'missing' as missing from bot_state, jsonb_each(coalesce(price_history->'positions','{}'::jsonb)) p"
          q "select kind, price_history->>'lastUsdc' as usdc, price_history->>'lastSol' as sol, price_history->>'vault' as vault, left((price_history->'positions')::text,200) as pos, left((price_history->'fresh')::text,200) as fresh, left(price_history->>'signal',150) as signal from bot_state"
          q "select symbol, kind, active, seen_at, left(why,60) from token_universe where kind='nouveau' order by added_at desc limit 8"
          q "select kind, status, last_tick_at, left(last_message, 200), config->>'researchPerps' as perps, config->>'extraSoft' as soft, config->>'autopilot' as pilot, jsonb_array_length(coalesce(config->'plans','[]'::jsonb)) as plans from bot_state"
          q "select created_at, agent, left(detail, 250) from agent_log order by created_at desc limit 15"
          q "select kind, active, count(*) from token_universe group by 1,2"
          q "select created, left(regexp_replace(content::text, '\s+', ' ', 'g'), 400) from net._http_response where content::text like '%\"spot\"%' and (content::text ilike '%erreur%' or content::text ilike '%error%') order by created desc limit 8"
          q "select left(content::text, 160), count(*) from net._http_response where content::text like '%\"spot\"%' and created > now() - interval '30 minutes' group by 1 order by 2 desc limit 10"
          q "select family, kind, interval, count(*), count(*) filter (where verdict='prometteuse') as prom, count(*) filter (where verdict='à surveiller') as surv from research where created_at > now() - interval '90 minutes' group by 1,2,3 order by 4 desc"
          q "select verdict, count(*) from research group by 1"
          q "select family, interval, left(why, 70), count(*), round(avg((test->>'trades')::numeric),1) as t_trades, round(avg((train->>'trades')::numeric),1) as tr_trades from research where created_at > now() - interval '3 hours' group by 1,2,3 order by 4 desc limit 25"
          q "select kind, price_history->>'errStreak' as err, price_history->>'cooldownUntil' as cd, left(price_history->>'signal', 200) from bot_state"
          q "select bot, created_at, coalesce(side, action), coalesce(symbol, asset), amount_usd, collateral_usd, pnl_usd, left(reason,60) from trades order by created_at desc limit 12"
          q "select symbol, kind, active, liquidity, volume_24h, pool, left(why,60) from token_universe order by score desc nulls last limit 15"
          q "select jobname, schedule, active from cron.job"
          q "select status, left(return_message,200), start_time from cron.job_run_details order by start_time desc limit 10"
