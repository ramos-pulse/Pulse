# Diagnostic manuel (lecture seule) : état des bots, des recherches et des réponses du cron. Aucun secret affiché.
name: Diagnostic Pulse
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.62.10
      - run: supabase link --project-ref "$PROJECT_REF" --password "$PGPASSWORD" >/dev/null 2>&1 || true
      - name: Requêtes
        run: |
          URL=$(cat supabase/.temp/pooler-url 2>/dev/null)
          [ -z "$URL" ] && URL="postgresql://postgres.$PROJECT_REF@aws-0-eu-central-1.pooler.supabase.com:5432/postgres"
          URL=$(echo "$URL" | sed 's/:\[YOUR-PASSWORD\]//')
          q() { psql "$URL" -X -A -F ' | ' -c "$1" 2>&1 | cut -c1-4000; echo; }
          q "select kind, p->>'source' as src, p->>'confidence' as conf from bot_state, jsonb_array_elements(coalesce(config->'plans','[]'::jsonb)) p"
          q "select p->>'asset' a, p->>'family' f, p->>'interval' i, p->>'source' src, p->>'confidence' c, round((p->>'score')::numeric,2) sc, left((p->'params')::text,110) prm, r.id, r.market, r.verdict, r.test->>'trades' tt, round((r.test->>'profitFactor')::numeric,2) tpf, round((r.test->>'returnPct')::numeric,1) tret, round((r.test->>'winRate')::numeric,0) twr, round((r.test->>'maxDrawdownPct')::numeric,1) tdd, r.train->>'trades' trt, round((r.train->>'profitFactor')::numeric,2) trpf, round((r.train->>'returnPct')::numeric,1) trret, r.live::text, left(r.why,90), r.created_at from bot_state b cross join jsonb_array_elements(b.config->'plans') p left join research r on r.id = substring(p->>'source' from '#([0-9]+)')::bigint where b.kind='perps'"
          q "select kind, status, start_value_usd, goal_usd, end_at, last_value_usd from bot_state"
          q "select jsonb_pretty(price_history - 'curve' - 'brain') from bot_state where kind='perps'"
          q "select jsonb_pretty(price_history->'brain') from bot_state where kind='perps'"
          q "select id, created_at, validated_at, market, family, verdict, score, left(why,90), train::text, test::text, live::text from research where id=4841"
          q "select family, interval, count(*) n, count(*) filter (where verdict in ('prometteuse','à surveiller')) ok, count(*) filter (where (test->>'profitFactor')::numeric>=1 and (train->>'profitFactor')::numeric>=1 and (test->>'trades')::int>=3) both_pos, round(avg((test->>'trades')::numeric),1) t_tr, round(max(score)::numeric,2) best from research where kind='perps' and created_at > now() - interval '10 days' group by 1,2 order by 1,2"
          q "select id, market, family, interval, verdict, round(score::numeric,2) sc, test->>'trades' tt, round((test->>'profitFactor')::numeric,2) tpf, round((test->>'returnPct')::numeric,1) tret, train->>'trades' trt, round((train->>'profitFactor')::numeric,2) trpf, left(params::text,120) from research where kind='perps' and created_at > now() - interval '10 days' and (test->>'profitFactor')::numeric>=1 and (train->>'profitFactor')::numeric>=1 and (test->>'trades')::int>=3 order by (test->>'trades')::int desc limit 25"
          q "select id, market, verdict, round(score::numeric,2) sc, test->>'trades' tt, round((test->>'profitFactor')::numeric,2) tpf, round((test->>'returnPct')::numeric,1) tret, train->>'trades' trt, round((train->>'profitFactor')::numeric,2) trpf, created_at from research where id in (1670,1301,1696,3184,1298,5201)"
          q "select value::text from app_kv where key='hl_markets'"
          q "select now()"
          q "select max(created_at) as derniere, count(*) filter (where created_at > now() - interval '3 hours') as en_3h, count(*) as total from research"
          q "select created, status_code, timed_out, left(error_msg,150), left(regexp_replace(content::text, '\s+', ' ', 'g'), 1500) from net._http_response where content::text like '%research%' or content::text like '%watchdog%' or status_code <> 200 or timed_out order by created desc limit 8"
          q "select kind, p.key, p.value->>'symbol' as sym, p.value->>'entry' as entry, p.value->>'stop' as stop, p.value->>'target' as target, p.value->>'costUsd' as cost, p.value->'live' as live, to_timestamp((p.value->'live'->>'at')::bigint/1000) as live_at, p.value->>'missing' as missing from bot_state, jsonb_each(coalesce(price_history->'positions','{}'::jsonb)) p"
          q "select kind, price_history->>'lastUsdc' as usdc, price_history->>'lastSol' as sol, price_history->>'vault' as vault, left((price_history->'positions')::text,200) as pos, left((price_history->'fresh')::text,200) as fresh, left(price_history->>'signal',150) as signal from bot_state"
          q "select symbol, kind, active, seen_at, left(why,60) from token_universe where kind='nouveau' order by added_at desc limit 8"
          q "select kind, status, last_tick_at, left(last_message, 200), config->>'researchPerps' as perps, config->>'extraSoft' as soft, config->>'autopilot' as pilot, jsonb_array_length(coalesce(config->'plans','[]'::jsonb)) as plans from bot_state"
          q "select kind, config->>'maxPositions' mp, config->>'aggr' aggr, config->>'maxLev' lev, config->>'pilotAggressive' pa, config->>'extraSoft' soft, config->>'researchAggressive' ra from bot_state"
          echo "=== XRP ==="; q "select id, verdict, round(score::numeric,2) sc, params::text, test::text, train::text, live::text, left(why,90) from research where id=6503"; q "select (price_history->'positions')::text from bot_state where kind='perps'"
          echo "=== B2 1 ==="; q "select created_at, action, asset, side, round(collateral_usd::numeric,2) col, round(pnl_usd::numeric,3) pnl, left(reason,50), detail->>'levier' lev from trades where bot='perps' and created_at > now() - interval '3 days' order by created_at"
          echo "=== B2 2 ==="; q "select jsonb_pretty(config - 'plans') from bot_state where kind='perps'"
          echo "=== B2 3 ==="; q "select price_history->'brain'->>'riskMult' rm, price_history->'brain'->>'streak' st, jsonb_array_length(coalesce(price_history->'brain'->'trades','[]'::jsonb)) bt, price_history->>'cooldownUntil' cd, price_history->>'dayStartValue' dsv from bot_state where kind='perps'"
          echo "=== B2 4 ==="; q "select left(detail,170) from agent_log where agent='veilleur' order by created_at desc limit 3"
          echo "=== MATH 1 ==="; q "select kind, interval, family, count(*) n, count(*) filter (where verdict<>'rejetée') ok, split_part(min(why),' (',1) from research where origin='mathématicien' and created_at > now() - interval '3 days' group by 1,2,3 order by 1,2,4 desc"
          echo "=== MATH 2 ==="; q "select regime, live_regime, count(*), round(avg(hurst)::numeric,2) h, round(avg(ac1)::numeric,3) ac1, round(avg(vr)::numeric,2) vr, count(*) filter (where significant) sig from math_insights group by 1,2 order by 3 desc"
          echo "=== MATH 3 ==="; q "select market, regime, live_regime, round(hurst::numeric,2) h, round(ac1::numeric,3) ac1, round(vr::numeric,2) vr, significant, proposed, left(note,70) from math_insights order by updated_at desc limit 12"
          echo "=== MATH 4 ==="; q "select split_part(why,' (',1) w, count(*) from research where origin='mathématicien' and created_at > now() - interval '3 days' group by 1 order by 2 desc"
          echo "=== MATH 5 ==="; q "select left(rationale,90) r, count(*) n, count(*) filter (where verdict<>'rejetée') ok from research where origin='mathématicien' and created_at > now() - interval '3 days' group by 1 order by 2 desc limit 12"
          echo "=== RECH 1 ==="; q "select kind, family, count(*) n, count(*) filter (where verdict<>'rejetée') ok, round(100.0*count(*) filter (where verdict<>'rejetée')/count(*),1) pct from research where created_at > now() - interval '3 days' group by 1,2 order by 1,3 desc"
          echo "=== RECH 2 ==="; q "select kind, interval, origin, count(*) n, count(*) filter (where verdict<>'rejetée') ok from research where created_at > now() - interval '3 days' group by 1,2,3 order by 1,2,3"
          echo "=== RECH 3 ==="; q "select kind, split_part(why,' (',1) w, count(*) from research where created_at > now() - interval '3 days' and verdict='rejetée' group by 1,2 order by 3 desc limit 16"
          echo "=== RECH 4 ==="; q "select id, kind, market, family, verdict, round(score::numeric,2) sc, test->>'trades' tt, round((test->>'profitFactor')::numeric,2) tpf, train->>'trades' trt, round((train->>'profitFactor')::numeric,2) trpf, round((test->>'luck')::numeric,2) luck, live::text from research where live is not null order by created_at desc limit 20"
          echo "=== RECH 5 ==="; q "select date_trunc('hour', created_at) h, count(*) from research where created_at > now() - interval '8 hours' group by 1 order by 1"
          echo "=== RECH 6 ==="; q "select kind, verdict, count(*), round(avg((test->>'trades')::numeric),1) tt, round(avg((train->>'trades')::numeric),1) trt, round(avg((test->>'luck')::numeric),2) luck from research where verdict<>'rejetée' group by 1,2"
          echo "=== RECH 7 ==="; q "select market, count(*) n, max(created_at) last from research where created_at > now() - interval '1 day' group by 1 order by 2 desc"
          echo "=== RECH 8 ==="; q "select bot, count(*) filter (where pnl_usd>0) w, count(*) filter (where pnl_usd<0) l, round(sum(pnl_usd)::numeric,2) pnl from trades where pnl_usd is not null group by 1"
          q "select last_value_usd, start_value_usd, updated_at, last_tick_at, price_history->>'lastUsdc' usdc, price_history->>'lastSol' sol, price_history->>'vault' vault, price_history->>'dayStartValue' dsv, (price_history->'curve'->-1)::text last_curve, (price_history->'curve'->-3)::text c3 from bot_state where kind='spot'"
          q "select created_at, bot, side, symbol, round(amount_usd::numeric,2) usd, round(pnl_usd::numeric,3) pnl, left(reason,60) from trades where created_at > now() - interval '12 hours' order by created_at desc limit 12"
          q "select b.kind, p->>'source' src, r.id, r.verdict, r.created_at from bot_state b cross join jsonb_array_elements(b.config->'plans') p left join research r on r.id = substring(p->>'source' from '#([0-9]+)')::bigint where b.kind='spot'"
          q "select kind, interval, verdict, count(*), max(created_at) from research where kind='spot' and created_at > now() - interval '7 days' group by 1,2,3 order by 1,2,3"
          q "select id, market, family, verdict, round(score::numeric,2) sc, test->>'trades' tt, round((test->>'profitFactor')::numeric,2) tpf, round((test->>'returnPct')::numeric,1) tret, train->>'trades' trt, round((train->>'profitFactor')::numeric,2) trpf, left(why,50), coalesce(validated_at, created_at) from research where kind='spot' and verdict <> 'rejetée' order by score desc limit 15"
          q "select left(why,60), count(*) from research where kind='spot' and created_at > now() - interval '2 days' group by 1 order by 2 desc limit 8"
          q "select config->>'nerve' nerve, config->>'maxPositions' mp, config->>'researchPerps' rp, config->>'riskLevel' rl, config->>'aggr' aggr, left(config::text, 900) from bot_state where kind='spot'"
          q "select symbol, active, round(liquidity) liq, round(volume_24h) vol, left(why,50) from token_universe where kind='selection' and active order by volume_24h desc"
          q "select created_at, agent, left(detail, 250) from agent_log order by created_at desc limit 15"
          q "select kind, active, count(*) from token_universe group by 1,2"
          q "select created, left(regexp_replace(content::text, '\s+', ' ', 'g'), 400) from net._http_response where content::text like '%\"spot\"%' and (content::text ilike '%erreur%' or content::text ilike '%error%') order by created desc limit 8"
          q "select left(content::text, 160), count(*) from net._http_response where content::text like '%\"spot\"%' and created > now() - interval '30 minutes' group by 1 order by 2 desc limit 10"
          q "select family, kind, interval, count(*), count(*) filter (where verdict='prometteuse') as prom, count(*) filter (where verdict='à surveiller') as surv from research where created_at > now() - interval '90 minutes' group by 1,2,3 order by 4 desc"
          q "select verdict, count(*) from research group by 1"
          q "select family, interval, left(why, 70), count(*), round(avg((test->>'trades')::numeric),1) as t_trades, round(avg((train->>'trades')::numeric),1) as tr_trades from research where created_at > now() - interval '3 hours' group by 1,2,3 order by 4 desc limit 25"
          q "select kind, price_history->>'errStreak' as err, price_history->>'cooldownUntil' as cd, left(price_history->>'signal', 200) from bot_state"
          q "select bot, created_at, coalesce(side, action), coalesce(symbol, asset), amount_usd, collateral_usd, pnl_usd, left(reason,60) from trades order by created_at desc limit 12"
          q "select symbol, kind, active, liquidity, volume_24h, pool, left(why,60) from token_universe order by score desc nulls last limit 15"
          q "select jobname, schedule, active from cron.job"
          q "select status, left(return_message,200), start_time from cron.job_run_details order by start_time desc limit 10"
          A=0xfa361f55480739ce3412f0461576796bec710268
          echo "=== HL perps ==="; curl -s https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"clearinghouseState\",\"user\":\"$A\"}" | head -c 600; echo
          echo "=== HL spot ==="; curl -s https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"spotClearinghouseState\",\"user\":\"$A\"}" | head -c 400; echo
          echo "=== HL agents ==="; curl -s https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"extraAgents\",\"user\":\"$A\"}" | head -c 600; echo
          echo "=== HL abstraction ==="; curl -s https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"userAbstraction\",\"user\":\"$A\"}" | head -c 300; echo
          echo "=== HL ledger ==="; curl -s https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"userNonFundingLedgerUpdates\",\"user\":\"$A\",\"startTime\":1795800000000}" | head -c 2500; echo
          echo "=== HL role ==="; curl -s https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"userRole\",\"user\":\"$A\"}" | head -c 300; echo
          echo "=== HL ordres ==="; curl -s https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"frontendOpenOrders\",\"user\":\"$A\"}" | head -c 1500; echo
          echo "=== HL FILLS ==="; curl -s https://api.hyperliquid.xyz/info -H 'content-type: application/json' -d "{\"type\":\"userFillsByTime\",\"user\":\"$A\",\"startTime\":1795800000000}" | jq -c '.[] | {coin, dir, px, sz, closedPnl, fee, time: (.time/1000|todate), oid}' | head -40
          echo "=== JUP quote ==="; curl -s "https://lite-api.jup.ag/swap/v1/quote?inputMint=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v&outputMint=So11111111111111111111111111111111111111112&amount=20000000&slippageBps=100&restrictIntermediateTokens=true" | head -c 400; echo
          echo "=== HLCHECK ==="
          supabase functions deploy hlcheck --project-ref "$PROJECT_REF" --no-verify-jwt >/dev/null 2>&1 && sleep 5
          curl -s "https://$PROJECT_REF.supabase.co/functions/v1/hlcheck"; echo
          supabase functions delete hlcheck --project-ref "$PROJECT_REF" >/dev/null 2>&1 && echo "fonction temporaire supprimée"
          echo "=== RUGCHECK NINE ==="; curl -s https://api.rugcheck.xyz/v1/tokens/5KSw6G5P1dwgKLWp31Cj5ie8WGg5YEfUWz7gCxYxJLqh/report | jq -c '{creator, creatorBalance, supply: .token.supply, decimals: .token.decimals, rugged, score, score_normalised, risks: [.risks[]? | {name, level, value}], top: [.topHolders[0:3][]? | {pct, owner}], insiders: .graphInsidersDetected}' | head -c 1500; echo
          echo "=== RUGCHECK BONK ==="; curl -s https://api.rugcheck.xyz/v1/tokens/DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263/report/summary | head -c 600; echo
          echo "=== RUGCHECK LP ==="; for m in 5KSw6G5P1dwgKLWp31Cj5ie8WGg5YEfUWz7gCxYxJLqh $(curl -s https://api.rugcheck.xyz/v1/stats/recent | jq -r '.[0:3][]?.mint'); do curl -s https://api.rugcheck.xyz/v1/tokens/$m/report | jq -c '{mint, totalMarketLiquidity, lpLockedPct: [.markets[]? | {t: .marketType, lp: .lp.lpLockedPct, usd: .lp.lpLockedUSD, q: .lp.quoteUSD}][0:3], insiders: .graphInsidersDetected, nets: (.insiderNetworks // [] | length), transferFee: .transferFee, rugged}' | head -c 700; echo; sleep 1; done
          echo "=== RUGCHECK NEW ==="; curl -s https://api.rugcheck.xyz/v1/stats/new_tokens | jq -c '.[0:2]' | head -c 600; echo
