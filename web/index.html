<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08100c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pulse · Poste de contrôle</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08100c;--card:#0e1712;--card2:#142119;--line:#1e2d24;--text:#e8f0e9;--muted:#7f9386;--lime:#c8f560;--amber:#f2b54f;--red:#ef5350;--green:#4ade80;--blue:#7cb8ff;--onlime:#0b1405;--track:#1b2a1f;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Space Grotesk",-apple-system,Roboto,sans-serif;--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--sans)}
body{padding-bottom:calc(80px + var(--sb));overflow-x:clip}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 75%,transparent);padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;justify-content:space-between;align-items:center}
.brand{font:600 12px var(--mono);letter-spacing:.3em;color:var(--lime)}
.live{display:flex;gap:7px;align-items:center;font:12px var(--mono);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--lime);box-shadow:0 0 10px var(--lime);animation:p 2s infinite}.dot.bad{background:var(--red)}.dot.warn{background:var(--amber)}
@keyframes p{50%{opacity:.45}}
main{max-width:560px;margin:0 auto;padding:4px 16px 20px}
.page{display:none}.page.on{display:block}
.eyebrow{font:600 12px var(--mono);letter-spacing:.3em;color:var(--amber);margin:24px 4px 12px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
.status{display:flex;align-items:center;gap:10px;font:600 14px var(--mono);letter-spacing:.2em;text-transform:uppercase}
.status.run{color:var(--lime)}.status.pause{color:var(--amber)}.status.off{color:var(--muted)}.status.win{color:var(--green)}
.big{font:700 clamp(40px,13vw,54px)/1 var(--mono);letter-spacing:-.03em;margin:18px 0 8px}
.big small{font-size:.55em;margin-left:8px}
.sub{color:var(--muted)}
.sub{font-size:12.5px !important;line-height:1.45}
.btn.sm{min-height:34px;font-size:13px}
.bar{height:9px;border-radius:9px;background:#1b2a1f;overflow:hidden;margin:16px 0 2px}.bar i{display:block;height:100%;background:var(--lime);min-width:5px;border-radius:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:18px}
.k{font:12.5px var(--mono);color:var(--muted)}
.v{font:600 16.5px var(--mono);margin-top:3px;overflow-wrap:anywhere}
.v.txt{font:500 15px var(--sans)}
.sep{height:1px;background:var(--line);margin:18px 0}
.up{color:var(--green)}.down{color:var(--red)}.mut{color:var(--muted)}.amber{color:var(--amber)}
.think{margin-top:18px;padding:14px;border-radius:14px;background:var(--card2);font-style:italic;color:#cfe0d3}
.think b{font-style:normal;display:block;font:600 11px var(--mono);letter-spacing:.2em;color:var(--lime);margin-bottom:6px}
.range{position:relative;height:30px;margin:16px 2px 2px}
.range .t{position:absolute;top:12px;left:0;right:0;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(239,83,80,.6),#24352a 50%,rgba(74,222,128,.6))}
.range .e{position:absolute;top:6px;width:2px;height:18px;background:var(--muted)}
.range .n{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--text);border:4px solid var(--bg)}
.rl{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.btn{min-height:54px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font:600 16px var(--sans);padding:0 14px}
.btn.go{background:var(--lime);color:#0b1405;border-color:var(--lime)}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px}
.btn:active{transform:scale(.98)}.btn:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.addr{font:13.5px var(--mono);overflow-wrap:anywhere;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.l1{font:600 14px var(--mono);letter-spacing:.05em}.l2{font:12px var(--mono);color:var(--muted);margin-top:3px}
.r{text-align:right;font:600 14.5px var(--mono);white-space:nowrap}
#p-home .eyebrow{margin:14px 4px 8px;font-size:11px;letter-spacing:.22em}
#p-home .card{padding:14px 16px;border-radius:18px;margin-bottom:10px}
#p-home .status{font-size:12px;letter-spacing:.14em}
#p-home .big{font-size:clamp(28px,9vw,36px);margin:10px 0 4px}
#p-home .bar{margin:8px 0 0;height:6px}
#p-home .grid{grid-template-columns:repeat(4,1fr);gap:8px 10px;margin-top:10px}
#p-home .grid.g3{grid-template-columns:repeat(3,1fr)}
#p-home .k{font-size:10.5px}
#p-home .v{font-size:13px}
#p-home .v.txt{font-size:13.5px;line-height:1.4}
#p-home .sep{margin:10px 0}
#p-home .btns{gap:10px;margin:0 0 10px}
#p-home .btns .btn{min-height:44px;font-size:14.5px}
#p-home .think{margin-top:10px;padding:10px 12px;font-size:13px}
#p-home details{margin-top:8px}
#p-home summary{font:600 11px var(--mono);letter-spacing:.14em;color:var(--muted);cursor:pointer;list-style:none;padding:4px 0}
#p-home summary::-webkit-details-marker{display:none}
#p-home details[open] summary{color:var(--lime)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 2px}
.sum a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.sum .n{font:700 22px/1.1 var(--mono);margin:6px 0 2px}
.sum .t{font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:6px}
[data-tip]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:help}
[data-tip] .k::after,.k[data-tip]::after{content:" ⓘ";opacity:.55}
.tip{position:fixed;z-index:60;max-width:min(300px,86vw);background:#e9f5d8;color:#0c130e;border-radius:12px;padding:10px 12px;font:500 13px/1.4 var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none}
.pill{font:600 10.5px var(--mono);letter-spacing:.1em;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--muted)}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.chip{padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font:13px var(--mono);white-space:nowrap}
.chip.on{background:var(--lime);color:#0b1405;border-color:var(--lime)}
table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:400}
.note{font-size:13px;color:var(--muted);text-align:center;margin:6px 10px 18px}
.warnbox{border:1px solid rgba(242,181,79,.4);background:rgba(242,181,79,.08);color:#f6d79a;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.45;margin-bottom:14px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.field:last-child{border-bottom:0}
input[type=checkbox]{accent-color:var(--lime)}
input[type=range]{width:100%;accent-color:var(--lime);padding:0;border:0;background:none;height:36px}
input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:16px var(--mono);width:130px;text-align:right}
.bubble{max-width:86%;padding:11px 14px;border-radius:16px;margin:8px 0;white-space:pre-wrap;line-height:1.45;font-size:15px}
.bubble.me{margin-left:auto;background:var(--lime);color:#0b1405;border-bottom-right-radius:5px}
.bubble.ai{background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.chatbox{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.chatbox textarea{flex:1;min-height:48px;max-height:140px;resize:none;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px;font:16px var(--sans)}
.pill.ok{background:rgba(74,222,128,.15);color:var(--green)}.pill.live{background:rgba(239,83,80,.15);color:var(--red)}.pill.mid{background:rgba(242,181,79,.14);color:var(--amber)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,16,12,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + var(--sb))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font:11px var(--mono);color:var(--muted);min-height:44px}
nav svg{width:22px;height:22px}nav button.on{color:var(--lime)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end}.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:24px 20px calc(20px + var(--sb))}
.sheet h3{margin:0 0 6px;font:600 20px var(--sans)}.sheet p{color:var(--muted);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:14px;z-index:40;max-width:90vw}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
#login input{width:100%;text-align:left;margin:16px 0}
/* ---- thèmes ---- */
[data-theme=light]{--bg:#f3f6f1;--card:#fff;--card2:#eef3ea;--line:#d9e3d4;--text:#0f1a12;--muted:#5b6d60;--lime:#3d7a08;--amber:#a86a12;--red:#d23c38;--green:#178a46;--blue:#2563eb;--onlime:#fff;--track:#e1e9dc}
[data-theme=oled]{--bg:#000;--card:#060908;--card2:#0c120e;--line:#151e18;--track:#111a14}
[data-theme=light] .think{color:#2c3d31}[data-theme=light] .tip{background:#10170f;color:#eef5ea}
[data-theme=light] .warnbox{color:#7a4f0d}
.btn.go,.chip.on,.bubble.me{color:var(--onlime)}
nav{background:color-mix(in srgb,var(--bg) 94%,transparent) !important}
.bar,.seg i{background:var(--track)}
/* ---- statut vivant ---- */
.dot.pulse{position:relative}.dot.pulse::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;color:inherit;opacity:0;animation:ring 1.8s infinite}
.dot.ok.pulse::after{color:var(--lime)}.dot.alert{background:var(--amber);box-shadow:0 0 10px var(--amber)}.dot.alert.pulse::after{color:var(--amber)}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.7);opacity:0}}
/* ---- accueil ---- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 16px 10px;margin:10px 0 10px}
.hero .t{font:600 10.5px var(--mono);letter-spacing:.2em;color:var(--muted);display:flex;align-items:center;gap:8px}
.hero .n{font:700 clamp(34px,11vw,44px)/1.05 var(--mono);letter-spacing:-.03em;margin:8px 0 2px}
.hero .n small{font-size:.5em;margin-left:6px}
.periods{display:flex;gap:6px;margin:10px 0 4px}.periods button{font:600 11px var(--mono);padding:6px 10px;border-radius:99px;background:var(--card2);color:var(--muted)}.periods button.on{background:var(--lime);color:var(--onlime)}
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%}
.chart .cur{position:absolute;top:0;bottom:16px;width:1px;background:var(--text);opacity:.5;display:none;pointer-events:none}
.chart .lbl{position:absolute;top:-4px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font:600 11.5px var(--mono);white-space:nowrap;display:none;pointer-events:none;z-index:2}
.flash-up{animation:fu 1s}.flash-down{animation:fd 1s}
@keyframes fu{0%{box-shadow:0 0 0 2px var(--green) inset}100%{box-shadow:none}}@keyframes fd{0%{box-shadow:0 0 0 2px var(--red) inset}100%{box-shadow:none}}
/* ---- réglages rapides sur la carte d'un bot ---- */
.srow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.qs{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}
.qs .lev{display:flex;gap:4px}.qs .lev button{font:600 10.5px var(--mono);padding:5px 7px;border-radius:8px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.qs .lev button.on{background:var(--lime);color:var(--onlime);border-color:var(--lime)}.qs .lev button.hot.on{background:var(--amber);border-color:var(--amber)}
.seg{display:flex;align-items:center;gap:6px;font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--muted)}
.seg span.bars{display:flex;gap:3px}.seg i{display:block;width:16px;height:8px;border-radius:3px;cursor:pointer}
.seg i.on{background:var(--lime)}.seg i.on.hot{background:var(--amber)}.seg i.on.red{background:var(--red)}
.qs .tg{font:600 10px var(--mono);padding:5px 8px;border-radius:8px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}.qs .tg.on{background:var(--amber);color:#1a1205;border-color:var(--amber)}
/* ---- barre stop → objectif ---- */
.pbar{position:relative;height:34px;margin:14px 2px 0}
.pbar .t{position:absolute;top:13px;left:0;right:0;height:8px;border-radius:8px;background:linear-gradient(90deg,rgba(239,83,80,.55),var(--track) 45%,rgba(74,222,128,.55))}
.pbar .f{position:absolute;top:13px;height:8px;border-radius:8px}
.pbar .m{position:absolute;top:7px;width:2px;height:20px;background:var(--muted)}
.pbar .n{position:absolute;top:6px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--text);border:4px solid var(--card);transition:left .6s}
.pl{display:flex;justify-content:space-between;font:10.5px var(--mono);color:var(--muted);margin-top:2px}
/* ---- squelettes de chargement ---- */
.skel{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
/* ---- agents ---- */
.agh{display:flex;align-items:center;gap:12px}
.ava{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);flex:none;position:relative}
.ava svg{width:24px;height:24px;color:var(--lime)}
.ava .zz{position:absolute;right:-4px;bottom:-4px;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 4px}
.ava .zz b{width:4px;height:4px;border-radius:50%;background:var(--lime);animation:bob 1.2s infinite}.ava .zz b:nth-child(2){animation-delay:.2s}.ava .zz b:nth-child(3){animation-delay:.4s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-3px);opacity:1}}
.mrow{padding:12px 0;border-bottom:1px solid var(--line)}.mrow:last-child{border-bottom:0}
.mrow .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* ---- micro ---- */
#mic{position:fixed;right:16px;bottom:calc(84px + var(--sb));z-index:25;width:52px;height:52px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#mic svg{width:24px;height:24px;color:var(--lime)}#mic.on{background:var(--lime)}#mic.on svg{color:var(--onlime)}#mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--lime);animation:ring 1.4s infinite}
/* ---- mini-jeu ---- */
.game .score{display:flex;justify-content:space-between;font:600 12px var(--mono);color:var(--muted);margin-bottom:8px}
.game .res{font:700 18px var(--sans);text-align:center;margin:8px 0;min-height:26px}
@media (prefers-reduced-motion:reduce){.dot.ok,.dot.pulse::after,.skel,.ava .zz b,#mic.on::after{animation:none}}
</style>
</head>
<body>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("pulse_theme")||"dark"}catch(e){}</script>
<div id="login"><div class="card" style="width:100%;max-width:400px">
  <div class="brand">PULSE</div>
  <h2 style="margin:14px 0 4px;font:600 24px var(--sans)">Connexion</h2>
  <div class="sub">Adresse de ton projet Supabase (ou juste son identifiant) et ton DASHBOARD_TOKEN.</div>
  <input id="srv" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://xxxx.supabase.co" style="margin-bottom:0">
  <input id="tok" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="DASHBOARD_TOKEN">
  <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:-6px 0 14px"><input type="checkbox" id="showTok" style="width:auto"> Afficher le mot de passe</label>
  <button class="btn go" style="width:100%" id="loginBtn">Entrer</button>
  <div id="loginErr" class="warnbox" style="display:none;margin:14px 0 0"></div>
</div></div>

<div id="app" style="display:none">
  <div class="top"><div class="brand">POSTE DE CONTRÔLE</div><div class="live"><span class="dot" id="dot"></span><span id="fresh">connexion…</span></div></div>
  <main>
    <div id="alerts"></div>
    <section class="page on" id="p-home"><div class="skel" style="height:150px;margin:10px 0"></div><div class="sum"><div class="skel" style="height:110px"></div><div class="skel" style="height:110px"></div></div><div class="skel" style="height:260px;margin-top:22px"></div><div class="skel" style="height:260px;margin-top:22px"></div></section>
    <section class="page" id="p-hist"></section>
    <section class="page" id="p-bt"></section>
    <section class="page" id="p-ag"></section>
    <section class="page" id="p-set"></section>
  </main>
  <nav id="nav">
    <button data-p="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Missions</button>
    <button data-p="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Historique</button>
    <button data-p="bt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M6 16l4-5 4 3 5-7"/></svg>Backtest</button>
    <button data-p="ag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></svg>Agents</button>
    <button data-p="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Réglages</button>
  </nav>
</div>

<div class="sheet-bg" id="sheet"><div class="sheet" id="sheetBody"></div></div>
<button id="mic" aria-label="Commande vocale" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>

<script>
{
const OPEN = new Set();
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset?.d) d.open ? OPEN.add(d.dataset.d) : OPEN.delete(d.dataset.d); }, true);
let TOKEN = "", BASE = "", S = null, PAGE = "home", HF = "all", BT = null, lastOk = 0, seen = 0;
try { TOKEN = localStorage.getItem("pulse_token") || ""; BASE = localStorage.getItem("pulse_base") || ""; if (BASE && !/\.[a-z]+\/functions/.test(BASE)) BASE = serverUrl(BASE); seen = Number(localStorage.getItem("pulse_seen") || 0); } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = (n, d = 2) => n == null || !isFinite(n) ? "—" : Number(n).toLocaleString("fr-FR", {minimumFractionDigits: d, maximumFractionDigits: d});
const px = n => { if (n == null || !isFinite(n)) return "—"; const a = Math.abs(n); return a >= 100 ? nf(n, 2) : a >= 1 ? nf(n, 4) : Number(n).toPrecision(5).replace(".", ","); };
const sg = (n, d = 2) => n == null || !isFinite(n) ? "—" : (n > 0 ? "+" : "") + nf(n, d);
const cl = n => n > 0 ? "up" : n < 0 ? "down" : "mut";
const ago = iso => { if (!iso) return "—"; const s = Math.max(0, (Date.now() - new Date(iso)) / 1000); return s < 60 ? `${s|0} s` : s < 3600 ? `${(s/60)|0} min` : s < 86400 ? `${(s/3600)|0} h` : `${(s/86400)|0} j`; };
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"}) : "—";
function left(iso) { if (!iso) return "—"; let s = (new Date(iso) - Date.now()) / 1000; if (s <= 0) return "dépassée";
  const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60);
  return `${d}j ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; }

function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function sheet(htmlStr) { $("#sheetBody").innerHTML = htmlStr; $("#sheet").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

async function api(path, opts = {}) {
  let r;
  try { r = await fetch(BASE + path, {...opts, headers: {"x-token": TOKEN, "content-type": "application/json"}}); }
  catch (e) { throw new Error(`Serveur injoignable (${BASE}). Vérifie l'identifiant du projet, ou la fonction n'a pas démarré.`); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(j.error === "token invalide" ? "Mot de passe (DASHBOARD_TOKEN) incorrect." : (j.error || "Accès refusé.")); throw new Error("auth"); }
  if (!r.ok) { const m = j.error || j.message || j.msg || `Erreur serveur ${r.status}`; if (lastOk) toast(m); throw new Error(m); }
  return j;
}
function showLogin(err) { $("#login").style.display = "flex"; $("#app").style.display = "none";
  const box = $("#loginErr"); if (box) { box.style.display = err ? "block" : "none"; box.textContent = err || ""; } if (BASE) $("#srv").value = BASE.replace(/\/functions\/v1\/pulse$/, ""); }
/** Accepte « abcd1234 », « abcd1234.supabase.co » ou l'URL complète. */
function serverUrl(v) {
  v = v.trim().replace(/\s+/g, "").replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (!v) return "";
  if (!v.includes(".")) v += ".supabase.co";          // « abcd » → « abcd.supabase.co », avec ou sans https://
  return "https://" + v + "/functions/v1/pulse"; }
$("#showTok").onchange = e => { $("#tok").type = e.target.checked ? "text" : "password"; };
$("#loginBtn").onclick = () => { BASE = serverUrl($("#srv").value); TOKEN = $("#tok").value.trim();
  if (!BASE || !TOKEN) return toast("Remplis les deux champs");
  try { localStorage.setItem("pulse_token", TOKEN); localStorage.setItem("pulse_base", BASE); } catch (e) {}
  const box = $("#loginErr"); box.style.display = "block"; box.textContent = "Connexion…"; refresh(); };

$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.p); };
function go(p) { PAGE = p; if (p === "set") $("#p-set").innerHTML = ""; if (p === "ag") loadAg(); if (p === "hist") loadReport(); if (p === "home") loadCurve(); document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x.dataset.p === p));
  document.querySelectorAll(".page").forEach(x => x.classList.toggle("on", x.id === "p-" + p)); render(); scrollTo(0, 0); }

async function refresh() {
  try { S = await api("/api/state"); lastOk = Date.now(); $("#login").style.display = "none"; $("#app").style.display = "block"; $("#mic").style.display = "grid"; notifyNew(); if (!CURVE) loadCurve(); if (!SCRUB) render(); else fresh(); }
  catch (e) { if (!lastOk && e.message !== "auth") showLogin(e.message); fresh(); }
}
function fresh() { const s = lastOk ? (Date.now() - lastOk) / 1000 : 999, ok = s < 10;
  $("#dot").className = "dot " + (ok ? "ok" : "bad"); $("#fresh").textContent = ok ? "en direct" : lastOk ? `hors ligne · ${s|0} s` : "connexion…"; }

async function notifyNew() {
  const all = ["spot", "perps"].flatMap(k => S.bots[k].trades).filter(t => new Date(t.created_at).getTime() > seen);
  if (!all.length) return;
  seen = Math.max(...all.map(t => new Date(t.created_at).getTime())); try { localStorage.setItem("pulse_seen", seen); } catch (e) {}
  try { navigator.vibrate?.([35, 60, 35]); } catch (e) {} // petite vibration à chaque trade
  for (const t of all.slice(0, 3)) {
    const act = (t.action || t.side || "").toUpperCase();
    const msg = `${{BUY: "ACHAT", SELL: "VENTE", OPEN: "OUVERTURE", CLOSE: "FERMETURE", DEPOSIT: "DÉPÔT", WITHDRAW: "RETRAIT"}[act] || act} ${t.symbol || t.asset || ""}${t.pnl_usd != null ? " · " + sg(t.pnl_usd) + " $" : ""}`;
    if (document.hidden && "Notification" in window && Notification.permission === "granted") {
      const reg = await navigator.serviceWorker?.getRegistration(); reg?.showNotification("Pulse", {body: msg, icon: "icon-192.png"});
    } else toast(msg);
  }
}

const STATUS = {running: ["run", "En mission"], paused: ["pause", "En pause"], stopped: ["off", "Arrêté"], success: ["win", "Mission réussie"], destroyed: ["off", "Terminée"]};

/** Alertes : pilote sans stratégie, capital trop faible pour le nombre de positions. */
function alerts(kind, b) {
  const c = b.config || {}, sc = S.bots.spot.config || {}, out = [];
  const plans = kind === "spot" ? (c.plans || []) : (c.plans || []);
  if ((b.status === "running" || b.status === "paused") && c.autopilot && !plans.length)
    out.push(`Pilote automatique sans stratégie : aucune ne passe tes réglages, ce bot ne tradera pas.${sc.nerve === 3 ? " Ton réglage « Très nerveux » écarte toutes les stratégies lentes : essaie « Nerveux »." : sc.researchAggressive ? "" : " Le mode agressif des agents (Agents) accepterait plus de stratégies, mais moins sûres."}`);
  const v = Number(b.last_value_usd) - Number(b.vault || 0), n = c.maxPositions || 3;
  if (v > 0 && kind === "perps" && S.perpsVenue === "hyperliquid") { // Hyperliquid : 10 $ de TAILLE minimum (et non de collatéral)
    if (v < 4) out.push(`Capital très faible : ${nf(v)} $. Hyperliquid exige 10 $ de taille par position : seules des positions avec un stop serré seront possibles.`);
  } else if (v > 0 && kind === "perps") {
    const min = S.rules.perps?.minCollateralUsd ?? 10, fit = Math.floor(v / min);
    if (fit < Math.min(n, Math.max(1, plans.length || 1))) out.push(fit < 1 ? `Capital trop faible : Jupiter exige ${min} $ de collatéral par position, il n'y a que ${nf(v)} $. Aucune position perps possible.` : `Capital : ${nf(v)} $ permet au plus ${fit} position(s) perps (${min} $ de collatéral minimum chacune), pas ${n}.`);
  }
  if (v > 0 && kind === "spot" && v / n < 4) out.push(`Capital faible : ${nf(v)} $ pour ${n} positions, soit ${nf(v / n)} $ chacune (ordre minimum 2 $). Réduis le nombre de positions dans Réglages → Protections, ou ajoute des USDC.`);
  return out.map(t => `<div class="warnbox" style="margin-top:10px">⚠ ${esc(t)}</div>`).join("");
}
function bilanCard() {
  const b = S.bilan; if (!b) return "";
  return `<div class="card" style="padding:10px 16px"><details data-d="bilan" style="margin:0"><summary>▸ BILAN DU SOIR · ${new Date(b.created_at).toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"}).toUpperCase()}</summary>
    <p class="sub" style="margin:8px 0 0;font-size:13px !important">${esc(b.detail)}</p></details></div>`;
}
/** Les deux sommes en haut de l'écran, d'un coup d'œil. */
function summary() {
  const tile = (k, label) => { const b = S.bots[k], [sc, st] = STATUS[b.status] || ["off", b.status];
    const v = b.last_value_usd, start = b.start_value_usd, g = v != null && start ? v - start : null;
    const pos = (b.positions || []).map(p => k === "perps" ? `${p.side === "short" ? "SHORT" : "LONG"} ${p.symbol}` : p.symbol).join(", ");
    return `<a href="#card-${k}"><div class="t"><span class="dot ${dotClass(k)}"></span>${label} · ${st}</div>
      <div class="n" data-roll="tile-${k}" data-v="${v ?? ""}">${nf(v)} $</div><div class="k ${g == null ? "" : cl(g)}">${g == null ? "—" : `${sg(g)} $ (${sg(g / start * 100)} %)`}${pos ? ` · ${esc(pos)}` : ""}</div>${spark(b.curve)}</a>`; };
  const br = S.protections?.breakerTrippedAt ? `<div class="warnbox" style="margin-top:10px">⚠ Disjoncteur déclenché ${ago(new Date(S.protections.breakerTrippedAt).toISOString())} : les deux bots ont été arrêtés après une perte de plus de ${S.protections.breakerPct} %. Relance une mission quand tu es prêt.</div>` : "";
  return `${hero()}<div class="sum">${tile("spot", "Bot 1")}${tile("perps", "Bot 2")}</div>${br}${staleWarn()}`;
}
/** Courbe du capital (mini graphique) : vert si au-dessus du point de départ, rouge sinon. */
function spark(c) {
  if (!c || c.length < 2) return `<div class="l2" style="margin-top:6px;font-size:11px">courbe dans 1 h</div>`;
  const W = 140, H = 34, vs = c.map(x => x.v), lo = Math.min(...vs), hi = Math.max(...vs), t0 = c[0].t, t1 = c.at(-1).t;
  const X = t => ((t - t0) / Math.max(1, t1 - t0) * W).toFixed(1), Y = v => (hi > lo ? H - 2 - (v - lo) / (hi - lo) * (H - 4) : H / 2).toFixed(1);
  const up = vs.at(-1) >= vs[0], col = up ? "var(--green)" : "var(--red)";
  const pts = c.map(x => `${X(x.t)},${Y(x.v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;margin-top:6px">
    <polygon points="0,${H} ${pts} ${W},${H}" fill="${col}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
    <div class="l2" style="font-size:10.5px;display:flex;justify-content:space-between"><span>${ago(new Date(t0).toISOString())}</span><span>${nf(lo)}–${nf(hi)} $</span></div>`;
}

      </div>

          <div><div class="k">Vaut maintenant</div><div class="v ${cl(now != null ? now - stake : null)}">${now != null ? nf(now) + " $" : "—"}</div></div>
          <div><div class="k">${kind === "perps" ? "Taille" : "Gain"}</div><div class="v ${kind === "perps" ? "" : cl(now != null ? now - stake : null)}">${kind === "perps" ? (p.sizeUsd ? nf(p.sizeUsd) + " $" : "—") : now != null ? sg(now - stake) + " $" : "—"}</div></div></div>`; })()}
      ${posBar(p)}
      <button class="btn sm" style="width:100%;margin-top:10px" data-chart="${kind}|${esc(p.symbol)}|${p.interval === "15m" ? "15m" : "1h"}">📈 Graphique et trades</button>`;
  };
  const pos = list.map(posBlock).join("");
  const running = b.status === "running", paused = b.status === "paused";
  const wallet = S.wallets[kind];
  return `<div class="eyebrow" id="card-${kind}">${title}</div>
  <div class="card">

      <div><div class="k">Gain</div><div class="v ${cl(gain)}">${gain == null ? "—" : `${sg(gain)} $<br>${sg(gain / start * 100)} %`}</div></div>

      <button class="btn sm" style="margin-top:8px" data-rebase="${kind}">Remettre le gain à zéro</button>
      <p class="sub" style="margin:12px 0 0">${hlBot ? "Compte Hyperliquid : garde les USDC côté « Perps ». Le bot signe avec un portefeuille API qui ne peut pas retirer d'argent. Minimum 10 $ de taille par position, stops posés chez Hyperliquid."

      : `<p class="sub" style="margin:8px 0 0">${hlBot ? "Secrets HL_ACCOUNT_ADDRESS et HL_AGENT_PRIVATE_KEY absents" : `Secret ${kind === "spot" ? "BOT_WALLET_PRIVATE_KEY" : "PERPS_WALLET_PRIVATE_KEY"} absent`} dans Supabase (Edge Functions → Secrets).</p>`}
  </details></div>`;
}

function biasText(b) {
  if (b === 0) return "Longs et shorts à égalité";
  if (b === 100) return "Longs seulement";
  if (b === -100) return "Shorts seulement";
  return b > 0 ? `Longs à 100 %, shorts à ${100 - b} %` : `Shorts à 100 %, longs à ${100 + b} %`;
}
function perpsLabel() {
  const c = S.bots.perps.config || {aggr: 1, maxLev: 3, bias: 0};
  const lvl = c.autopilot && !c.pilotAggressive ? Math.min(c.aggr ?? 1, 1) : (c.aggr ?? 1);
  const plan = c.plans?.length ? ` · ${c.plans.map(p => p.asset + (p.interval === "15m" ? " 15m" : "")).join(", ")}` : "";
  return `${c.autopilot ? "Pilote auto" + (plan || " · en attente") : plan.replace(/^ · /, "")}${c.autopilot || plan ? " · " : ""}${S.rules.aggrLevels?.[lvl]?.name || ""} · ${S.perpsVenue === "hyperliquid" ? "levier selon le stop" : `x${c.maxLev ?? 3} max`}${c.bias ? " · " + biasText(c.bias) : ""}`;
}

function modeText(i) {

  return `Levier jusqu'à x${l}. La perte au stop dépend de l'agressivité, pas du levier : plus de levier = moins de collatéral bloqué. Le bot réduit toujours le levier pour que son stop soit touché bien avant la liquidation${l >= 100 ? " ; à x" + l + ", une variation d'environ " + nf(100 / l, 1) + " % contre toi suffirait à liquider, donc il ne l'atteindra qu'avec un stop très serré" : ""}.`;
}

function renderHist() {
  const rows = ["spot", "perps"].flatMap(k => S.bots[k].trades.map(t => ({...t, k}))).filter(t => HF === "all" || t.k === HF)

    <div class="chips">${[["all", "Tout"], ["spot", "Spot"], ["perps", "Perps"]].map(([k, l]) => `<button class="chip ${HF === k ? "on" : ""}" data-hf="${k}">${l}</button>`).join("")}</div>

/** Ce que fait une stratégie, en mots simples (bulle sur sa description). */
function explain(r) {
  const p = r.params || {}, iv = r.interval === "15m" ? "bougies de 15 minutes (scalping)" : "bougies d'une heure";
  const span = n => r.interval === "15m" ? `${n} bougies de 15 min (${nf(n / 4, n % 4 ? 1 : 0)} h)` : `${n} h`;
  if (r.family === "range") return `Range (marché sans tendance), sur ${iv}. Le bot trace des bandes de Bollinger autour de la moyenne des ${p.bbPeriod} dernières bougies (± ${String(p.bbK).replace(".", ",")} écart-type). Quand le prix sort sous la bande basse, il achète (long) ; au-dessus de la bande haute, il vend (short), en pariant sur le retour à la moyenne, qui est son objectif. Stop fixe à ${String(p.stopAtr).replace(".", ",")} ATR. Il ne le fait que si le marché n'est PAS en tendance (force < ${String(p.maxTrend).replace(".", ",")} ATR), et il sort si le retour n'arrive pas à temps.${p.hours === "actives" ? " Heures actives seulement (lundi-vendredi, 8 h – 22 h à Paris)." : ""}`;
  const v = x => String(x).replace(".", ","), hrs = p.hours === "actives" ? " Elle n'entre qu'aux heures actives (lundi-vendredi, 8 h – 22 h à Paris) : la nuit et le week-end, les fausses cassures sont plus fréquentes." : "";
  const sess = { utc: "de minuit UTC (1 h du matin à Paris, ouverture de l'Asie)", eu: "de l'Europe (9 h à Paris)", us: "de Wall Street (15 h 30 à Paris)" };
  if (r.family === "orb") return `Cassure de la zone d'ouverture (ORB), sur ${iv}. Le bot note le plus haut et le plus bas des ${p.zoneMin} premières minutes de la séance ${sess[p.session] || ""}. Si le prix sort de cette zone dans les ${v(p.window)} h qui suivent, il ${r.kind === "perps" ? "suit la cassure (long vers le haut, short vers le bas)" : "achète la cassure vers le haut"}. Objectif : ${v(p.target)} fois la hauteur de la zone. Stop de l'autre côté de la zone. Une seule cassure par séance.${hrs}`;
  if (r.family === "vwap") return `Retour au prix moyen du jour (VWAP), sur ${iv}. Le VWAP est le prix moyen payé depuis minuit UTC, pondéré par les volumes échangés. Quand le prix s'en écarte de plus de ${v(p.dev)} fois la volatilité (ATR), le bot ${r.kind === "perps" ? "parie sur le retour (long en dessous, short au-dessus)" : "achète en dessous, en pariant sur le retour"}. Objectif : le VWAP. Stop fixe à ${v(p.stopAtr)} ATR. Seulement si le marché n'est pas en tendance forte (force < ${v(p.maxTrend)} ATR).${hrs}`;
  if (r.family === "squeeze") return `Cassure de compression, sur ${iv}. Quand les bandes de Bollinger se resserrent fortement (parmi les ${Math.round(p.pct * 100)} % les plus serrées des ${p.lookback} dernières bougies), le marché « retient son souffle » : un gros mouvement suit souvent. Le bot ${r.kind === "perps" ? "suit l'explosion dans un sens ou dans l'autre" : "achète si l'explosion part vers le haut"}, puis laisse courir avec un stop suiveur à ${v(p.trailAtr)} ATR. C'est une stratégie qui trouve des trades même quand le marché est calme.${hrs}`;
  if (r.family === "volume") return `Momentum de volume, sur ${iv}. Le bot entre quand le volume échangé sur une bougie dépasse ${v(p.volMult)} fois la moyenne, avec une bougie forte (au moins ${v(p.body)} ATR) qui clôture près de son extrême : de gros acteurs viennent d'entrer. Il ${r.kind === "perps" ? "suit ce mouvement (long ou short)" : "achète si c'est à la hausse"}, avec un stop suiveur à ${v(p.trailAtr)} ATR.${hrs}`;
  if (r.family === "funding") return `Funding extrême (perps), sur ${iv}. Le funding est ce que paient les acheteurs aux vendeurs (ou l'inverse) sur les marchés à terme : très élevé, il montre que la foule est massivement d'un côté (mesuré sur Hyperliquid). Au-delà de ${Math.round(p.level * 24 * 365 * 100)} % par an, et seulement si le prix commence à aller contre la foule, le bot prend le pari inverse. Stop ${v(p.stopAtr)} ATR, objectif 2 fois le risque, ${p.hold} bougies maximum.`;
  if (r.family === "rsi") return `Achat d'excès de baisse, sur ${iv}. Le bot achète quand le RSI(${p.rsiPeriod}), un indicateur de 0 à 100 qui mesure la force des derniers mouvements, descend sous ${p.entry} : le prix a chuté trop vite. Il n'achète que si la tendance de fond reste haussière (prix au-dessus de sa moyenne sur ${p.smaPeriod} bougies). Il revend quand le RSI repasse au-dessus de ${p.exit}. Stop de protection sous le plus bas des ${p.swingBars} dernières bougies.`;
  if (p.entry === "repli") return `Achat sur repli, sur ${iv}. Dans une tendance déjà en place (au moins ${String(p.minTrend).replace(".", ",")} fois la volatilité, ATR), le bot attend que le prix revienne toucher sa moyenne des 20 dernières bougies puis reparte dans le sens de la tendance : il ${r.kind === "perps" ? "achète (ou vend à découvert en tendance baissière)" : "achète"} à ce moment-là, à un meilleur prix qu'une cassure. Stop suiveur à ${String(p.trailAtr).replace(".", ",")} ATR du meilleur prix.${hrs}`;
  return `Suivi de tendance, sur ${iv}. Le bot ${r.kind === "perps" ? "ouvre un long quand le prix casse son plus haut, ou un short quand il casse son plus bas," : "achète quand le prix casse son plus haut"} des ${span(p.breakout)}, seulement si la tendance est assez forte (au moins ${String(p.minTrend).replace(".", ",")} fois la volatilité moyenne, ATR). Il laisse courir le gain avec un stop suiveur placé à ${String(p.trailAtr).replace(".", ",")} ATR du meilleur prix : le stop monte avec le prix et ne redescend jamais.${hrs}`;
}

/** Courbe totale (bot 1 + bot 2), un point par heure. */
function totalCurve() {
  const a = CURVE?.spot?.length ? CURVE.spot : S.bots.spot.curve || [], b = CURVE?.perps?.length ? CURVE.perps : S.bots.perps.curve || [];
  const ts = [...new Set([...a, ...b].map(x => Math.floor(x.t / 3600000) * 3600000))].sort((x, y) => x - y);
  // Un bot sans courbe (ou avant son premier point) compte pour sa valeur actuelle :
  // sinon le total « saute » quand sa courbe démarre et affiche un faux gain.
  const nowA = S.bots.spot.last_value_usd ?? 0, nowB = S.bots.perps.last_value_usd ?? 0;
  let ia = 0, ib = 0, va = a[0]?.v ?? nowA, vb = b[0]?.v ?? nowB; const out = [];
  for (const t of ts) {
    while (ia < a.length && a[ia].t < t + 3600000) va = a[ia++].v;
    while (ib < b.length && b[ib].t < t + 3600000) vb = b[ib++].v;
    out.push({t, v: va + vb});
  }
  const now = nowA + nowB;
  if (out.length) out.push({t: Date.now(), v: now});
  return out;
}

/** Chiffres qui défilent quand ils changent, et léger flash vert/rouge de la carte. */
const ROLL = {};

    const k = el.dataset.roll, v = parseFloat(el.dataset.v); if (!isFinite(v)) return;
    const prev = ROLL[k]; ROLL[k] = v;

    const card = el.closest(".card,.hero,a"); card?.classList.remove("flash-up", "flash-down"); void card?.offsetWidth; card?.classList.add(v > prev ? "flash-up" : "flash-down");

}

/** Barre stop → objectif d'une position, avec le prix actuel. */
function posBar(p) {

  const long = p.side !== "short", target = p.target ?? (long ? Math.max(p.best ?? entry, cur, entry + 2 * Math.abs(entry - stop)) : Math.min(p.best ?? entry, cur, entry - 2 * Math.abs(entry - stop)));
  const a = long ? stop : target, b = long ? target : stop, lo = Math.min(a, cur), hi = Math.max(b, cur), at = v => hi > lo ? (v - lo) / (hi - lo) * 100 : 50;
  const L = long ? at(stop) : at(target), R = long ? at(target) : at(stop), E = at(entry), C = at(cur), win = long ? cur >= entry : cur <= entry;
  const prog = Math.max(0, Math.min(100, (long ? (cur - stop) / (target - stop) : (stop - cur) / (stop - target)) * 100));
  return `<div class="pbar" data-tip="Progression de la position, du stop (perte maximale) à l'objectif ${p.target ? "fixé par la stratégie" : "indicatif (2 fois le risque)"} : ${nf(prog, 0)} % du chemin."><div class="t" style="left:${Math.min(L, R)}%;right:${100 - Math.max(L, R)}%${long ? "" : ";transform:scaleX(-1)"}"></div>
    <div class="f" style="left:${Math.min(E, C)}%;width:${Math.abs(C - E)}%;background:${win ? "var(--green)" : "var(--red)"};opacity:.75"></div>
    <div class="m" style="left:${E}%"></div><div class="n" style="left:${C}%"></div></div>
    <div class="pl"><span class="down">stop ${px(stop)}</span><span>entrée ${px(entry)}</span><span class="up">${p.target ? "objectif" : "2R"} ${px(target)}</span></div>`;
}

/** Graphique de prix d'une position : bougies, entrée, stop, objectif et trades passés. */
/** Bougies lues depuis le téléphone sur GeckoTerminal (tokens du sélectionneur et nouveaux tokens). */
async function phoneCandles(symbol, interval) {
  if (!AGS?.selector) AGS = await api("/api/agents");
  const row = [...(AGS.selector?.tokens || []), ...(AGS.fresh?.tokens || [])].find(r => r.symbol === symbol && r.pool);
  if (!row) return null;
  const path = interval === "15m" ? "minute?aggregate=15" : "hour?aggregate=1";
  for (let i = 0; i < 3; i++) {
    const r = await fetch(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${row.pool}/ohlcv/${path}&limit=120&currency=usd`, { headers: { accept: "application/json" } });
    if (r.status === 429) { await new Promise(res => setTimeout(res, 1500 * (i + 1))); continue; }
    if (!r.ok) return null;
    const list = (await r.json())?.data?.attributes?.ohlcv_list || [];
    const candles = list.map(([t, o, h, l, c]) => [t * 1000, +o, +h, +l, +c]).sort((a, b) => a[0] - b[0]);
    return candles.length ? { candles, trades: [] } : null;
  }
  return null;
}

let GAME = {best: 0, data: null, k: 0, score: 0, streak: 0, bot: 0, n: 0, guessed: null};

const GAME_MARKETS = [["perps", "SOL"], ["perps", "ETH"], ["perps", "BTC"], ["spot", "JUP"], ["spot", "BONK"], ["spot", "WIF"]];
async function gameRound(newMarket) {
  if (newMarket || !GAME.data || GAME.n % 5 === 0) {
    const [kind, sym] = GAME_MARKETS[Math.floor(Math.random() * GAME_MARKETS.length)], iv = Math.random() < 0.5 ? "1h" : "15m";
    $("#sheetBody").innerHTML = `<div class="skel" style="height:300px"></div>`;
    try { GAME.data = {...(await api(`/api/chart?kind=${kind}&symbol=${sym}&interval=${iv}&count=400`)), sym, iv}; } catch (e) { toast("Graphique indisponible"); return closeSheet(); }
  }
  const c = GAME.data.candles; GAME.k = 60 + Math.floor(Math.random() * Math.max(1, c.length - 61)); GAME.guessed = null; gameDraw();
}
function gameDraw(reveal) {
  const c = GAME.data.candles, show = c.slice(Math.max(0, GAME.k - 60), GAME.k + (reveal ? 1 : 0)), W = 360, H = 200;
  const lo = Math.min(...show.map(x => x[3])), hi = Math.max(...show.map(x => x[2])), bw = W / 61;
  const Y = v => 8 + (hi - v) / (hi - lo || 1) * (H - 16);
  const bars = show.map(([, o, h, l, cl_], i) => { const up = cl_ >= o, last = reveal && i === show.length - 1, col = last ? "var(--amber)" : up ? "var(--green)" : "var(--red)", x = i * bw + bw / 2;
    return `<line x1="${x}" x2="${x}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}"/><rect x="${x - bw * .35}" width="${bw * .7}" y="${Y(Math.max(o, cl_))}" height="${Math.max(1, Math.abs(Y(o) - Y(cl_)))}" fill="${col}"/>`; }).join("");
  const next = c[GAME.k], prev = c[GAME.k - 1], up = next ? next[4] >= prev[4] : null;
  const closes = c.slice(0, GAME.k).map(x => x[4]), ema = (n) => closes.reduce((a, v, i) => i ? v * 2 / (n + 1) + a * (1 - 2 / (n + 1)) : v, 0);
  const botGuess = closes.length > 25 ? (ema(10) >= ema(25) ? "up" : "down") : "up"; // le chercheur suit la tendance
  let res = "";
  if (reveal) { const ok = (GAME.guessed === "up") === up, bok = (botGuess === "up") === up;
    res = `<div class="res ${ok ? "up" : "down"}">${ok ? "✓ Gagné !" : "✗ Raté"} · c'était une ${up ? "hausse" : "baisse"} (${sg((next[4] / prev[4] - 1) * 100)} %)</div><p class="sub" style="text-align:center;margin:0 0 8px">Le chercheur avait dit ${botGuess === "up" ? "hausse" : "baisse"} ${bok ? "✓" : "✗"}</p>`; }
  $("#sheetBody").innerHTML = `<div class="game"><h3>🎮 Devine la bougie</h3>
    <div class="score"><span>Toi : ${GAME.score} / ${GAME.n}</span><span>Série : ${GAME.streak} · record ${GAME.best}</span><span>Chercheur : ${GAME.bot}</span></div>
    <div class="l2" style="margin-bottom:6px">${GAME.data.kind === "perps" ? "" : "Spot "}${esc(GAME.data.sym)} · bougies ${GAME.data.iv === "15m" ? "15 min" : "1 h"} · date cachée</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--card2);border-radius:14px">${bars}</svg>${res}
    ${reveal ? `<div class="btns" style="margin-top:8px"><button class="btn" id="sheetCancel">Arrêter</button><button class="btn go" id="gameNext">Suivante</button></div>`
      : `<p class="sub" style="text-align:center;margin:10px 0">La prochaine bougie va-t-elle clôturer plus haut ou plus bas ?</p><div class="btns"><button class="btn red" data-guess="down">▼ Baisse</button><button class="btn go" data-guess="up">▲ Hausse</button></div>`}</div>`;
  GAME.botGuess = botGuess;
}
function gameGuess(g) {
  if (GAME.guessed) return; GAME.guessed = g;
  const c = GAME.data.candles, up = c[GAME.k][4] >= c[GAME.k - 1][4], ok = (g === "up") === up;
  GAME.n++; if (ok) { GAME.score++; GAME.streak++; } else GAME.streak = 0;
  if ((GAME.botGuess === "up") === up) GAME.bot++;
  if (GAME.streak > GAME.best) { GAME.best = GAME.streak; try { localStorage.setItem("pulse_game_best", GAME.best); } catch (e) {} }
  try { navigator.vibrate?.(ok ? 30 : [20, 40, 20]); } catch (e) {}
  gameDraw(true);
}

let REC = null, LISTEN = false, WAKE_REC = null;
const AGGR_WORDS = [["très agressif", 4], ["agressif", 3], ["dynamique", 2], ["normal", 1], ["prudent", 0]];
const NERVE_WORDS = [["très nerveux", 3], ["nerveux", 2], ["normal", 1], ["calme", 0]];
function parseCommand(raw) {
  const t = raw.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’']/g, " ");
  const kinds = /bot ?(1|un)\b|spot/.test(t) ? ["spot"] : /bot ?(2|deux)\b|perp/.test(t) ? ["perps"] : ["spot", "perps"];
  if (/urgence|ferme tout|coupe tout|vends tout/.test(t)) return {act: "stop", kinds, sensitive: true, say: `Arrêt d'urgence ${kinds.length > 1 ? "des deux bots" : kinds[0] === "spot" ? "du bot 1" : "du bot 2"}`};
  const lev = /levier\D{0,6}(\d+)/.exec(t);
  if (lev) { const l = +lev[1]; if (!(S.rules.leverages || []).includes(l)) return {err: `Levier x${l} non proposé (choix : ${(S.rules.leverages || []).map(x => "x" + x).join(", ")})`}; return {act: "lev", v: l, sensitive: l >= 100, say: `Levier maximum x${l}`}; }
  if (/agressivit/.test(t)) { const w = AGGR_WORDS.find(([k]) => t.includes(k.normalize("NFD").replace(/[̀-ͯ]/g, ""))); if (w) return {act: "aggr", v: w[1], sensitive: w[1] >= 3, say: `Agressivité ${S.rules.aggrLevels?.[w[1]]?.name}`}; }
  if (/nervosit/.test(t)) { const w = NERVE_WORDS.find(([k]) => t.includes(k)); if (w) return {act: "nerve", v: w[1], say: `Nervosité ${["Calme", "Normal", "Nerveux", "Très nerveux"][w[1]]}`}; }
  if (/mode agressif|agents agressifs/.test(t)) { const on = !/(coupe|desactive|arrete|enleve)/.test(t); return {act: "agag", v: on, sensitive: on, say: `Mode agressif des agents ${on ? "activé" : "coupé"}`}; }
  if (/pause|arrete|stoppe/.test(t)) return {act: "pause", kinds, say: `Pause ${kinds.length > 1 ? "des deux bots" : kinds[0] === "spot" ? "du bot 1" : "du bot 2"}`};
  if (/reprend|relance|redemarre|continue|lance/.test(t)) return {act: "resume", kinds, say: `Reprise ${kinds.length > 1 ? "des deux bots" : kinds[0] === "spot" ? "du bot 1" : "du bot 2"}`};
  if (/tu fais quoi|que fais|quoi de neuf|ca va|t es ou|tu en es ou/.test(t)) return {act: "whats"};
  if (/solde|combien|capital|valeur|argent/.test(t)) return {act: "info"};
  if (/position/.test(t)) return {act: "pos"};
  return {err: `Je n'ai pas compris « ${raw} ». Essaie : « pause bot 2 », « levier x5 », « agressivité prudent », « solde ».`};
}
function speak(txt) { try { const u = new SpeechSynthesisUtterance(txt); u.lang = "fr-FR"; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }

  } catch (e) { toast("Échec : " + e.message); }

    <input id="cmdIn" style="width:100%;text-align:left" placeholder="ex. mets le bot 2 en pause" autocomplete="off">
    <div class="btns" style="margin-top:12px"><button class="btn" id="sheetCancel">Annuler</button><button class="btn go" id="cmdGo">Envoyer</button></div>
    <p class="sub" style="margin:10px 0 0">${isBrave ? "Brave ne fournit pas la reconnaissance vocale directe : la dictée du clavier la remplace très bien." : ""}</p>`);
  setTimeout(() => $("#cmdIn")?.focus(), 50);
}
function listen(onText) {
  if (!SR) return voiceFallback();
  const r = new SR(); r.lang = "fr-FR"; r.interimResults = false; r.maxAlternatives = 1;
  let got = false; const timer = setTimeout(() => { if (!got) { try { r.abort(); } catch (e) {} voiceFallback(); } }, 7000);
  r.onresult = e => { got = true; clearTimeout(timer); onText(e.results[0][0].transcript); };
  r.onerror = e => { clearTimeout(timer); if (!got && e.error !== "aborted") voiceFallback(); };
  r.onend = () => { $("#mic").classList.remove("on"); REC = null; };
  try { r.start(); REC = r; $("#mic").classList.add("on"); } catch (e) { voiceFallback(); }
}
/** « Hey Pulse » : écoute continue tant que l'app est ouverte à l'écran (Chrome) ; la phrase qui suit est l'ordre. */
function wakeStart() {
  if (!SR || !WAKE || document.hidden || WAKE_REC) return;
  const r = new SR(); r.lang = "fr-FR"; r.continuous = true; r.interimResults = false;
  r.onresult = e => { const txt = e.results[e.results.length - 1][0].transcript.toLowerCase();
    const m = /(?:h[eé]+|et|ok)\s*puls?e?\s*,?\s*(.*)/.exec(txt); if (!m) return;
    try { navigator.vibrate?.(40); } catch (er) {}
    if (m[1].trim().length > 3) runCommand(parseCommand(m[1])); else { try { r.stop(); } catch (er) {} setTimeout(() => listen(t => runCommand(parseCommand(t))), 300); } };
  r.onend = () => { WAKE_REC = null; setTimeout(wakeStart, 800); };
  r.onerror = () => {};
  try { r.start(); WAKE_REC = r; } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.hidden) { try { WAKE_REC?.stop(); } catch (e) {} } else wakeStart(); });
$("#mic").addEventListener("click", () => { if (REC) { try { REC.stop(); } catch (e) {} return; } listen(t => runCommand(parseCommand(t))); });

/** Réglages rapides : appliqués tout de suite (confirmation pour les choix risqués). */
async function quickApply(what, v) {
  const pc = S.bots.perps.config || {}, sc = S.bots.spot.config || {};
  const body = what === "lev" ? {maxLev: v} : {aggr: v};
  try {
    if (what === "lev" || what === "aggr") { await api("/api/perps/config", {method: "POST", body: JSON.stringify(body)}); toast(what === "lev" ? `Levier max x${v}` : `Agressivité : ${S.rules.aggrLevels[v].name}`); }
    if (what === "nerve") { await api("/api/research/settings", {method: "POST", body: JSON.stringify({nerve: v, aggressive: !!sc.researchAggressive})}); toast(`Nervosité : ${["Calme", "Normal", "Nerveux", "Très nerveux"][v]}`); }
    if (what === "agag") { await api("/api/research/settings", {method: "POST", body: JSON.stringify({aggressive: v, nerve: sc.nerve ?? 1})}); toast(v ? "Agents en mode agressif" : "Agents en mode normal"); }
    if (what.startsWith("soft-")) { const kind = what.slice(5), r = await api("/api/extra-soft", {method: "POST", body: JSON.stringify({on: v, kind})}); toast(`${kind === "spot" ? "Bot spot" : "Bot perps"} : extra souple ${v ? "activé" : "coupé"} · ${r.pilot}`); }
    if (what === "day") { await api("/api/daily-stop", {method: "POST", body: JSON.stringify({on: v})}); toast(v ? "Stop du jour activé" : "Stop du jour coupé : les bots continuent de trader"); }
    if (what === "fresh") { await api("/api/agents/fresh", {method: "POST", body: JSON.stringify({on: v})}); toast(v ? "Agent nouveaux tokens : achats activés" : "Agent nouveaux tokens : observation seulement"); }
  } catch (e) {}
  void pc; await refresh();
}
function quickConfirm(what, v, txt) {
  sheet(`<h3>Confirmer ?</h3><p>${txt}</p><div class="btns"><button class="btn" id="sheetCancel">Annuler</button><button class="btn go" data-qok="${what}" data-qv="${v}">Valider</button></div>`);
}

// ---------------------------------------------------------------- actions
document.addEventListener("click", async e => {
  const seg = e.target.closest("i[data-qaggr],i[data-qnerve]");
  if (seg) { const n = seg.dataset.qaggr != null ? +seg.dataset.qaggr : +seg.dataset.qnerve, what = seg.dataset.qaggr != null ? "aggr" : "nerve";
    if (what === "aggr" && n >= 3) return quickConfirm("aggr", n, `Agressivité « ${S.rules.aggrLevels[n].name} » : risque ×${S.rules.aggrLevels[n].riskMult} par trade, jusqu'à ${nf(S.rules.aggrLevels[n].dailyLoss * 100, 0)} % de perte par jour.`);
    if (what === "nerve" && n === 3) return quickConfirm("nerve", 3, "« Très nerveux » IMPOSE des stratégies rapides : si aucune n'est validée pour un bot, il ne trade plus du tout.");
    return quickApply(what, n); }
  const row = e.target.closest("[data-tr]");
  if (row && !e.target.closest("a")) { const [k, id] = row.dataset.tr.split(":"); const tr = S.bots[k].trades.find(x => String(x.id) === id); if (tr) whyTrade(tr, k); return; }
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.range) { RANGE = t.dataset.range; try { localStorage.setItem("pulse_range", RANGE); } catch (err) {} render(); return; }
  if (t.dataset.chart) { const [k, sym, iv] = t.dataset.chart.split("|"); return openChart(k, sym, iv); }
  if (t.dataset.sim) return openSim(t.dataset.sim);
  if (t.dataset.qlev) { const l = +t.dataset.qlev; return l >= 100 ? quickConfirm("lev", l, `Levier jusqu'à x${l} : une variation d'environ ${nf(100 / l, 1)} % contre toi suffirait à liquider. Le bot garde toujours son stop bien avant la liquidation, mais c'est très risqué.`) : quickApply("lev", l); }
  if (t.dataset.qag) { const on = !S.bots.spot.config?.researchAggressive; return on ? quickConfirm("agag", 1, "Mode agressif des agents : critères de validation assouplis et agressivité perps appliquée même en pilote automatique. Plus de trades, moins sûrs.") : quickApply("agag", false); }
  if (t.dataset.qsoft) { const k = t.dataset.qsoft === "perps" ? "perps" : "spot", on = !S.bots[k].config?.extraSoft;
    return on ? quickConfirm("soft-" + k, 1, `Mode EXTRA SOUPLE pour le ${k === "spot" ? "bot spot" : "bot perps"} : le chercheur accepte presque toutes les stratégies positives (≥ 3 trades, PF ≥ 1), et si rien ne passe le pilote prend quand même la meilleure. Chaque trade prend la moitié du risque normal. ${k === "spot" ? "L'agent nouveaux tokens devient moins exigeant (les contrôles anti-arnaque restent). " : ""}Plus de trades, mais moins prouvés : attends-toi à des pertes.`) : quickApply("soft-" + k, false); }
  if (t.dataset.qday) { const on = !S.bots.spot.config?.dailyStop; return quickApply("day", on); }
  if (t.dataset.qfresh) { const on = !S.bots.spot.config?.newTokens; return on ? quickConfirm("fresh", 1, "Agent nouveaux tokens : il achètera (2 à 5 $ par token) des tokens lancés depuis moins de 24 h qui passent les garde-fous. Terrain très risqué.") : quickApply("fresh", false); }
  if (t.dataset.qok) { closeSheet(); const v = t.dataset.qv; return quickApply(t.dataset.qok, v === "1" && ["agag", "fresh", "soft-spot", "soft-perps"].includes(t.dataset.qok) ? true : +v); }
  if (t.dataset.th) { THEME = t.dataset.th; document.documentElement.dataset.theme = THEME; try { localStorage.setItem("pulse_theme", THEME); } catch (err) {}
    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()); renderSet(); return; }
  if (t.id === "pushOn") return enablePush();
  if (t.id === "whatsUp") return whatsUp();
  if (t.id === "whatsSpeak") { speak(window.__whats || ""); return; }
  if (t.id === "pushTest") { try { const r = await api("/api/push/test", {method: "POST"}); toast(r.sent ? "Notification envoyée" : "Aucun téléphone abonné"); } catch (err) {} return; }
  if (t.id === "gameStart") { GAME.score = GAME.n = GAME.bot = GAME.streak = 0; sheet(""); return gameRound(true); }
  if (t.id === "gameNext") return gameRound(false);
  if (t.dataset.guess) return gameGuess(t.dataset.guess);
  if (t.id === "selRun") { t.textContent = "Sélection en cours…"; try { const r = await api("/api/agents/selector/run", {method: "POST"}); toast(r.result); } catch (err) {} return loadAg(); }
  if (t.id === "voiceOk") { closeSheet(); const c = window.__pendingCmd; window.__pendingCmd = null; if (c) runCommand(c); return; }
  if (t.id === "cmdGo") { const v = $("#cmdIn").value.trim(); closeSheet(); if (v) runCommand(parseCommand(v)); return; }
  if (t.dataset.rebase) { const k = t.dataset.rebase;
    sheet(`<h3>Remettre le gain à zéro ?</h3><p>Le point de départ du ${k === "spot" ? "bot 1" : "bot 2"} devient sa valeur actuelle (${nf(S.bots[k].last_value_usd)} $). Utile si un dépôt ou un transfert a été compté comme un gain. Les positions et la mission continuent normalement.</p>
      <div class="btns"><button class="btn" id="sheetCancel">Annuler</button><button class="btn go" data-dorebase="${k}">Remettre à zéro</button></div>`); return; }
  if (t.dataset.dorebase) { closeSheet(); try { await api(`/api/${t.dataset.dorebase}/rebase`, {method: "POST"}); toast("Gain remis à zéro"); } catch (err) {} return refresh(); }
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast("Adresse copiée"); } catch (err) { toast("Copie impossible"); } return; }
  if (t.dataset.hf) { HF = t.dataset.hf; renderHist(); return; }
  if (t.dataset.pr) { document.querySelectorAll(`[data-pr="${t.dataset.pr}"]`).forEach(x => x.classList.toggle("on", x === t)); return; }
  if (t.id === "saveProt") { const v = g => +($(`[data-pr="${g}"].on`)?.dataset.v ?? 0);
    try { const r = await api("/api/protections", {method: "POST", body: JSON.stringify({
        spot: {maxPositions: v("sp-max"), vaultPct: v("sp-vault"), partialTp: $("#prSpPartial").checked, marketFilter: $("#prFilter").checked},
        perps: {maxPositions: v("pp-max"), vaultPct: v("pp-vault"), partialTp: $("#prPpPartial").checked}, breakerPct: v("breaker")})});
      toast(`Protections enregistrées · disjoncteur ${r.spot.breakerPct ? "−" + r.spot.breakerPct + " %" : "coupé"}`); } catch (e) {}
    await refresh(); renderSet(); return; }
  if (t.id === "chatSend") return sendChat();
  if (t.id === "agSave") { const aggressive = $("#agAggr").checked, nerve = +$("#agNerve").value, perps = +$("#agPerps").value; window.__agDraft = null;
    try { const r = await api("/api/research/settings", {method: "POST", body: JSON.stringify({aggressive, nerve, perps})});
      toast(`Agents : ${r.aggressive ? "mode agressif" : "mode normal"} · ${AG?.settings?.levels?.[r.nerve] || ""}`); } catch (e) {}
    await refresh(); await loadAg(); return; }
  if (t.id === "swapRun") { if (SW_BUSY) return; SW_BUSY = true; renderAg();
    try { const r = await api("/api/agents/swap/run", {method: "POST"});
      const txt = ["spot", "perps"].map(k => typeof r[k] === "string" ? `${k} : ${r[k]}` : `${k} : ${r[k].vendus} vente(s), ${r[k].comptesFermes} compte(s) fermé(s), +${nf(r[k].solRecupere, 4)} SOL`).join(" · ");
      toast(txt); } catch (e) {}
    SW_BUSY = false; await loadAg(); return; }
  if (t.id === "chatClear") { CHAT = []; try { localStorage.removeItem("pulse_chat"); } catch (e) {} renderAg(); return; }
  if (t.id === "agRun") { if (AG_BUSY) return; AG_BUSY = true; renderAg();
    try { const r = await api("/api/research/run", {method: "POST"}); toast(`${r.tested} stratégies testées sur ${r.market}`); } catch (e) {}
    AG_BUSY = false; await loadAg(); return; }
  if (t.dataset.apply) { const id = t.dataset.apply, kind = t.dataset.kind;
    sheet(`<h3>Appliquer la stratégie #${esc(id)} ?</h3><p>${esc(t.dataset.desc)}</p><p>${kind === "spot" ? "Elle rejoint les plans du bot spot (3 maximum, une par token)." : "Elle remplace le plan du bot perps."} Une position déjà ouverte garde ses règles. Tu pourras revenir aux réglages automatiques à tout moment.</p>
      <div class="btns"><button class="btn" id="sheetCancel">Annuler</button><button class="btn go" data-doapply="${esc(id)}">Appliquer</button></div>`); return; }
  if (t.dataset.doapply) { closeSheet(); const r = await api("/api/research/apply", {method: "POST", body: JSON.stringify({id: +t.dataset.doapply})});
    toast(`Stratégie appliquée au bot ${r.kind}`); await refresh(); loadAg(); return; }
  if (t.dataset.auto) { for (const k of t.dataset.auto === "all" ? ["spot", "perps"] : [t.dataset.auto]) await api(`/api/${k}/config`, {method: "POST", body: JSON.stringify({trend: null})});
    toast("Retour aux réglages automatiques"); await refresh(); loadAg(); return; }
  if (t.dataset.strat) { document.querySelectorAll("[data-strat]").forEach(x => x.classList.toggle("on", x === t));
    $("#rsiFields").style.display = t.dataset.strat === "rsi" ? "" : "none"; $("#saveStrat").dataset.sel = t.dataset.strat; return; }
  if (t.dataset.lev && t.id !== "savePerps") {
    document.querySelectorAll(".chip[data-lev]").forEach(x => x.classList.toggle("on", x === t));
    $("#savePerps").dataset.lev = t.dataset.lev; $("#levTxt").textContent = levText(+t.dataset.lev); return; }
  if (t.id === "savePerps") {
    const r = await api("/api/perps/config", {method: "POST", body: JSON.stringify({aggr: +$("#paggr").value, maxLev: +t.dataset.lev, bias: +$("#pbias").value})});
    toast(`Perps : ${S.rules.aggrLevels[r.config.aggr].name} · levier max x${r.config.maxLev} · ${biasText(r.config.bias)}`); BT = null; await refresh(); renderSet(); return; }
  if (t.id === "saveStrat") {
    const body = {strategy: t.dataset.sel, rsi: {rsiPeriod: +$("#r-period").value, entry: +$("#r-entry").value, exit: +$("#r-exit").value,
      smaPeriod: +$("#r-sma").value, swingBars: +$("#r-swing").value, riskPct: +String($("#r-risk").value).replace(",", "."), naive: $("#r-naive").checked}};
    const r = await api("/api/spot/config", {method: "POST", body: JSON.stringify(body)});
    toast(r.config.strategy === "rsi" ? "Stratégie RSI enregistrée" : "Suivi de tendance enregistré"); BT = null; await refresh(); renderSet(); return; }
  if (t.id === "btRun") {
    BT = "loading"; renderBt(); const results = [];
    for (let i = 0; i < S.markets.length; i++) {
      try { results.push(await api(`/api/backtest?market=${i}`)); } catch (err) { results.push({market: S.markets[i], error: "indisponible"}); }
      BT = {results, partial: i < S.markets.length - 1}; renderBt();
    }
    return; }
  if (t.id === "notif") { if (!("Notification" in window)) return toast("Non supporté ici"); await Notification.requestPermission(); renderSet(); return; }
  if (t.id === "install") { if (window.__inst) { window.__inst.prompt(); window.__inst = null; } else toast("Menu ⋮ de Brave → « Ajouter à l'écran d'accueil »"); return; }
  if (t.id === "logout") { try { localStorage.removeItem("pulse_token"); } catch (err) {} location.reload(); return; }
  if (t.dataset.goal) { const k = t.dataset.goal;
    await api(`/api/${k}/goal`, {method: "POST", body: JSON.stringify({goal_usd: Number($("#goal-" + k).value), days: Number($("#days-" + k).value)})}); toast("Enregistré"); await refresh(); renderSet(); return; }
  if (t.id === "sheetCancel") return closeSheet();
  const k = t.dataset.k, act = t.dataset.act;
  if (act === "pause") { await api(`/api/${k}/pause`, {method: "POST"}); toast("En pause (la position reste gérée)"); refresh(); }
  if (act === "start") {
    const b = S.bots[k];
    if (b.status === "paused") { await api(`/api/${k}/start`, {method: "POST", body: "{}"}); toast("Mission reprise"); refresh(); return; }
    sheet(`<h3>Lancer la mission</h3><p>Le bot va trader avec les fonds du portefeuille ${k === "spot" ? "spot" : "perps"}.</p>
      <label class="field"><span>Objectif ($)</span><input type="number" id="sg" value="${b.goal_usd}"></label>
      <label class="field"><span>Échéance (jours)</span><input type="number" id="sd" value="30"></label>
      <div class="btns" style="margin-top:16px"><button class="btn" id="sheetCancel">Annuler</button><button class="btn go" data-act="go" data-k="${k}">Lancer</button></div>`);
  }
  if (act === "go") { await api(`/api/${k}/start`, {method: "POST", body: JSON.stringify({goal_usd: Number($("#sg").value), days: Number($("#sd").value)})}); closeSheet(); toast("Mission lancée"); refresh(); }
  if (act === "stop") sheet(`<h3>Arrêt d'urgence</h3><p>${k === "spot" ? "Tous les jetons seront revendus en USDC" : "La position perps sera fermée"} et le bot mis en pause.</p>
      <div class="btns"><button class="btn" id="sheetCancel">Annuler</button><button class="btn red" data-act="kill" data-k="${k}">Tout arrêter</button></div>`);
  if (act === "kill") { closeSheet(); toast("Fermeture en cours… (jusqu'à 1 min)"); try { await api(`/api/${k}/stop`, {method: "POST"}); toast("Arrêté"); } catch (err) {} refresh(); }
});

document.addEventListener("change", async e => {
  if (e.target.id === "agAggr") { window.__agDraft = {aggressive: e.target.checked, nerve: +$("#agNerve").value, perps: +$("#agPerps").value}; if (e.target.checked) toast("Mode agressif : pense à enregistrer"); return; }
  if (e.target.id === "freshOn") { const on = e.target.checked; if (on && !confirm("Activer les achats de nouveaux tokens (2 à 5 $ par token, terrain très risqué) ?")) { e.target.checked = false; return; }
    await api("/api/agents/fresh", {method: "POST", body: JSON.stringify({on})}); toast(on ? "Achats de nouveaux tokens activés" : "Observation seulement"); await refresh(); return loadAg(); }
  if (e.target.id === "wakeOn") { WAKE = e.target.checked; try { localStorage.setItem("pulse_wake", WAKE ? "1" : "0"); } catch (err) {}
    if (WAKE && !SR) toast("Pas de reconnaissance vocale dans ce navigateur : utilise le micro du clavier"); if (WAKE) wakeStart(); else { try { WAKE_REC?.stop(); } catch (err) {} } return; }
  if (e.target.dataset?.swapauto) { await api("/api/agents/swap/auto", {method: "POST", body: JSON.stringify({on: e.target.checked})}); toast(e.target.checked ? "Nettoyage automatique activé" : "Nettoyage automatique coupé"); return loadAg(); }
  const k = e.target.dataset?.pilot; if (!k) return;
  const on = e.target.checked;
  try { const r = await api("/api/autopilot", {method: "POST", body: JSON.stringify({[k]: on})});
    toast(on ? `Pilote automatique activé (${k}) : ${r.pilot}` : `Pilote automatique coupé (${k})`); } catch (err) { e.target.checked = !on; }
  await refresh(); loadAg();
});
document.addEventListener("input", e => { if (e.target.id === "pbias") $("#pbiasTxt").textContent = biasText(+e.target.value);
  if (e.target.id === "agNerve" || e.target.id === "agAggr" || e.target.id === "agPerps") window.__agDraft = {aggressive: $("#agAggr").checked, nerve: +$("#agNerve").value, perps: +$("#agPerps").value};
  if (e.target.id === "agPerps") $("#agPerpsTxt").textContent = perpsTxt(+e.target.value);
  if (e.target.id === "agNerve") { $("#agNerveName").textContent = (AG?.settings?.levels || [])[+e.target.value] || ""; $("#agNerveTxt").textContent = window.__nerveTxt?.(+e.target.value) || ""; }
  if (e.target.id === "paggr") { $("#paggrName").textContent = S.rules.aggrLevels[+e.target.value].name; $("#pmodeTxt").textContent = modeText(+e.target.value); } });
setInterval(() => { if (PAGE === "ag" && !document.hidden && !AG_BUSY) loadAg(); }, 60000);
document.addEventListener("keydown", e => { if (e.target.id === "chatIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  if (e.target.id === "cmdIn" && e.key === "Enter") { e.preventDefault(); $("#cmdGo")?.click(); } });
wakeStart();
addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__inst = e; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
if (!TOKEN || !BASE) showLogin(); else refresh();
setInterval(() => { if (!lastOk) return; if (!document.hidden && !$("#sheet").classList.contains("on")) refresh(); else fresh(); }, 5000);
}
</script>
