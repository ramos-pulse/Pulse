<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08100c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Pulse · Poste de contrôle</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08100c;--card:#0e1712;--card2:#142119;--line:#1e2d24;--text:#e8f0e9;--muted:#7f9386;--lime:#c8f560;--amber:#f2b54f;--red:#ef5350;--green:#4ade80;--blue:#7cb8ff;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--sans:"Space Grotesk",-apple-system,Roboto,sans-serif;--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 var(--sans)}
body{padding-bottom:calc(80px + var(--sb));overflow-x:clip}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 75%,transparent);padding:calc(14px + env(safe-area-inset-top)) 18px 10px;display:flex;justify-content:space-between;align-items:center}
.brand{font:600 12px var(--mono);letter-spacing:.3em;color:var(--lime)}
.live{display:flex;gap:7px;align-items:center;font:12px var(--mono);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--lime);box-shadow:0 0 10px var(--lime);animation:p 2s infinite}.dot.bad{background:var(--red)}.dot.warn{background:var(--amber)}
@keyframes p{50%{opacity:.45}}
main{max-width:560px;margin:0 auto;padding:4px 16px 20px}
.page{display:none}.page.on{display:block}
.eyebrow{font:600 12px var(--mono);letter-spacing:.3em;color:var(--amber);margin:24px 4px 12px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}
.status{display:flex;align-items:center;gap:10px;font:600 14px var(--mono);letter-spacing:.2em;text-transform:uppercase}
.status.run{color:var(--lime)}.status.pause{color:var(--amber)}.status.off{color:var(--muted)}.status.win{color:var(--green)}
.big{font:700 clamp(40px,13vw,54px)/1 var(--mono);letter-spacing:-.03em;margin:18px 0 8px}
.big small{font-size:.55em;margin-left:8px}
.sub{color:var(--muted)}
.sub{font-size:12.5px !important;line-height:1.45}
.btn.sm{min-height:34px;font-size:13px}
.bar{height:9px;border-radius:9px;background:#1b2a1f;overflow:hidden;margin:16px 0 2px}.bar i{display:block;height:100%;background:var(--lime);min-width:5px;border-radius:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:18px}
.k{font:12.5px var(--mono);color:var(--muted)}
.v{font:600 16.5px var(--mono);margin-top:3px;overflow-wrap:anywhere}
.v.txt{font:500 15px var(--sans)}
.sep{height:1px;background:var(--line);margin:18px 0}
.up{color:var(--green)}.down{color:var(--red)}.mut{color:var(--muted)}.amber{color:var(--amber)}
.think{margin-top:18px;padding:14px;border-radius:14px;background:var(--card2);font-style:italic;color:#cfe0d3}
.think b{font-style:normal;display:block;font:600 11px var(--mono);letter-spacing:.2em;color:var(--lime);margin-bottom:6px}
.range{position:relative;height:30px;margin:16px 2px 2px}
.range .t{position:absolute;top:12px;left:0;right:0;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(239,83,80,.6),#24352a 50%,rgba(74,222,128,.6))}
.range .e{position:absolute;top:6px;width:2px;height:18px;background:var(--muted)}
.range .n{position:absolute;top:5px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--text);border:4px solid var(--bg)}
.rl{display:flex;justify-content:space-between;font:11.5px var(--mono);color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.btn{min-height:54px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font:600 16px var(--sans);padding:0 14px}
.btn.go{background:var(--lime);color:#0b1405;border-color:var(--lime)}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{min-height:40px;font-size:14px;border-radius:12px}
.btn:active{transform:scale(.98)}.btn:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.addr{font:13.5px var(--mono);overflow-wrap:anywhere;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.l1{font:600 14px var(--mono);letter-spacing:.05em}.l2{font:12px var(--mono);color:var(--muted);margin-top:3px}
.r{text-align:right;font:600 14.5px var(--mono);white-space:nowrap}
#p-home .eyebrow{margin:14px 4px 8px;font-size:11px;letter-spacing:.22em}
#p-home .card{padding:14px 16px;border-radius:18px;margin-bottom:10px}
#p-home .status{font-size:12px;letter-spacing:.14em}
#p-home .big{font-size:clamp(28px,9vw,36px);margin:10px 0 4px}
#p-home .bar{margin:8px 0 0;height:6px}
#p-home .grid{grid-template-columns:repeat(4,1fr);gap:8px 10px;margin-top:10px}
#p-home .grid.g3{grid-template-columns:repeat(3,1fr)}
#p-home .k{font-size:10.5px}
#p-home .v{font-size:13px}
#p-home .v.txt{font-size:13.5px;line-height:1.4}
#p-home .sep{margin:10px 0}
#p-home .btns{gap:10px;margin:0 0 10px}
#p-home .btns .btn{min-height:44px;font-size:14.5px}
#p-home .think{margin-top:10px;padding:10px 12px;font-size:13px}
#p-home details{margin-top:8px}
#p-home summary{font:600 11px var(--mono);letter-spacing:.14em;color:var(--muted);cursor:pointer;list-style:none;padding:4px 0}
#p-home summary::-webkit-details-marker{display:none}
#p-home details[open] summary{color:var(--lime)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 2px}
.sum a{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:inherit;text-decoration:none}
.sum .n{font:700 22px/1.1 var(--mono);margin:6px 0 2px}
.sum .t{font:600 10.5px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:6px}
[data-tip]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:help}
[data-tip] .k::after,.k[data-tip]::after{content:" ⓘ";opacity:.55}
.tip{position:fixed;z-index:60;max-width:min(300px,86vw);background:#e9f5d8;color:#0c130e;border-radius:12px;padding:10px 12px;font:500 13px/1.4 var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none}
.pill{font:600 10.5px var(--mono);letter-spacing:.1em;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--muted)}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.chip{padding:9px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font:13px var(--mono);white-space:nowrap}
.chip.on{background:var(--lime);color:#0b1405;border-color:var(--lime)}
table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:400}
.note{font-size:13px;color:var(--muted);text-align:center;margin:6px 10px 18px}
.warnbox{border:1px solid rgba(242,181,79,.4);background:rgba(242,181,79,.08);color:#f6d79a;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.45;margin-bottom:14px}
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.field:last-child{border-bottom:0}
input[type=checkbox]{accent-color:var(--lime)}
input[type=range]{width:100%;accent-color:var(--lime);padding:0;border:0;background:none;height:36px}
input{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:16px var(--mono);width:130px;text-align:right}
.bubble{max-width:86%;padding:11px 14px;border-radius:16px;margin:8px 0;white-space:pre-wrap;line-height:1.45;font-size:15px}
.bubble.me{margin-left:auto;background:var(--lime);color:#0b1405;border-bottom-right-radius:5px}
.bubble.ai{background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.chatbox{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.chatbox textarea{flex:1;min-height:48px;max-height:140px;resize:none;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px;font:16px var(--sans)}
.pill.ok{background:rgba(74,222,128,.15);color:var(--green)}.pill.live{background:rgba(239,83,80,.15);color:var(--red)}.pill.mid{background:rgba(242,181,79,.14);color:var(--amber)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(8,16,12,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + var(--sb))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font:11px var(--mono);color:var(--muted);min-height:44px}
nav svg{width:22px;height:22px}nav button.on{color:var(--lime)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none;align-items:flex-end}.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:24px 20px calc(20px + var(--sb))}
.sheet h3{margin:0 0 6px;font:600 20px var(--sans)}.sheet p{color:var(--muted);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sb));transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:14px;z-index:40;max-width:90vw}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
#login input{width:100%;text-align:left;margin:16px 0}
@media (prefers-reduced-motion:reduce){.dot.ok{animation:none}}
</style>
</head>
<body>
<div id="login"><div class="card" style="width:100%;max-width:400px">
  <div class="brand">PULSE</div>
  <h2 style="margin:14px 0 4px;font:600 24px var(--sans)">Connexion</h2>
  <div class="sub">Adresse de ton projet Supabase (ou juste son identifiant) et ton DASHBOARD_TOKEN.</div>
  <input id="srv" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://xxxx.supabase.co" style="margin-bottom:0">
  <input id="tok" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="DASHBOARD_TOKEN">
  <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:-6px 0 14px"><input type="checkbox" id="showTok" style="width:auto"> Afficher le mot de passe</label>
  <button class="btn go" style="width:100%" id="loginBtn">Entrer</button>
  <div id="loginErr" class="warnbox" style="display:none;margin:14px 0 0"></div>
</div></div>

<div id="app" style="display:none">
  <div class="top"><div class="brand">POSTE DE CONTRÔLE</div><div class="live"><span class="dot" id="dot"></span><span id="fresh">connexion…</span></div></div>
  <main>
    <div id="alerts"></div>
    <section class="page on" id="p-home"></section>
    <section class="page" id="p-hist"></section>
    <section class="page" id="p-bt"></section>
    <section class="page" id="p-ag"></section>
    <section class="page" id="p-set"></section>
  </main>
  <nav id="nav">
    <button data-p="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Missions</button>
    <button data-p="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Historique</button>
    <button data-p="bt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M6 16l4-5 4 3 5-7"/></svg>Backtest</button>
    <button data-p="ag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6M11 8v6"/></svg>Agents</button>
    <button data-p="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Réglages</button>
  </nav>
</div>

<div class="sheet-bg" id="sheet"><div class="sheet" id="sheetBody"></div></div>

<script>
{
const OPEN = new Set();
document.addEventListener("toggle", e => { const d = e.target; if (d.dataset?.d) d.open ? OPEN.add(d.dataset.d) : OPEN.delete(d.dataset.d); }, true);
let TOKEN = "", BASE = "", S = null, PAGE = "home", HF = "all", BT = null, lastOk = 0, seen = 0;
try { TOKEN = localStorage.getItem("pulse_token") || ""; BASE = localStorage.getItem("pulse_base") || ""; if (BASE && !/\.[a-z]+\/functions/.test(BASE)) BASE = serverUrl(BASE); seen = Number(localStorage.getItem("pulse_seen") || 0); } catch (e) {}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = (n, d = 2) => n == null || !isFinite(n) ? "—" : Number(n).toLocaleString("fr-FR", {minimumFractionDigits: d, maximumFractionDigits: d});
const px = n => { if (n == null || !isFinite(n)) return "—"; const a = Math.abs(n); return a >= 100 ? nf(n, 2) : a >= 1 ? nf(n, 4) : Number(n).toPrecision(5).replace(".", ","); };
const sg = (n, d = 2) => n == null || !isFinite(n) ? "—" : (n > 0 ? "+" : "") + nf(n, d);
const cl = n => n > 0 ? "up" : n < 0 ? "down" : "mut";
const ago = iso => { if (!iso) return "—"; const s = Math.max(0, (Date.now() - new Date(iso)) / 1000); return s < 60 ? `${s|0} s` : s < 3600 ? `${(s/60)|0} min` : s < 86400 ? `${(s/3600)|0} h` : `${(s/86400)|0} j`; };
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"}) : "—";
function left(iso) { if (!iso) return "—"; let s = (new Date(iso) - Date.now()) / 1000; if (s <= 0) return "dépassée";
  const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60);
  return `${d}j ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; }

function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function sheet(htmlStr) { $("#sheetBody").innerHTML = htmlStr; $("#sheet").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

async function api(path, opts = {}) {
  let r;
  try { r = await fetch(BASE + path, {...opts, headers: {"x-token": TOKEN, "content-type": "application/json"}}); }
  catch (e) { throw new Error(`Serveur injoignable (${BASE}). Vérifie l'identifiant du projet, ou la fonction n'a pas démarré.`); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(j.error === "token invalide" ? "Mot de passe (DASHBOARD_TOKEN) incorrect." : (j.error || "Accès refusé.")); throw new Error("auth"); }
  if (!r.ok) { const m = j.error || j.message || j.msg || `Erreur serveur ${r.status}`; if (lastOk) toast(m); throw new Error(m); }
  return j;
}
function showLogin(err) { $("#login").style.display = "flex"; $("#app").style.display = "none";
  const box = $("#loginErr"); if (box) { box.style.display = err ? "block" : "none"; box.textContent = err || ""; } if (BASE) $("#srv").value = BASE.replace(/\/functions\/v1\/pulse$/, ""); }
/** Accepte « abcd1234 », « abcd1234.supabase.co » ou l'URL complète. */
function serverUrl(v) {
  v = v.trim().replace(/\s+/g, "").replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  if (!v) return "";
  if (!v.includes(".")) v += ".supabase.co";          // « abcd » → « abcd.supabase.co », avec ou sans https://
  return "https://" + v + "/functions/v1/pulse"; }
$("#showTok").onchange = e => { $("#tok").type = e.target.checked ? "text" : "password"; };
$("#loginBtn").onclick = () => { BASE = serverUrl($("#srv").value); TOKEN = $("#tok").value.trim();
  if (!BASE || !TOKEN) return toast("Remplis les deux champs");
  try { localStorage.setItem("pulse_token", TOKEN); localStorage.setItem("pulse_base", BASE); } catch (e) {}
  const box = $("#loginErr"); box.style.display = "block"; box.textContent = "Connexion…"; refresh(); };

$("#nav").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.p); };
function go(p) { PAGE = p; if (p === "set") $("#p-set").innerHTML = ""; if (p === "ag") loadAg(); document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x.dataset.p === p));
  document.querySelectorAll(".page").forEach(x => x.classList.toggle("on", x.id === "p-" + p)); render(); scrollTo(0, 0); }

async function refresh() {
  try { S = await api("/api/state"); lastOk = Date.now(); $("#login").style.display = "none"; $("#app").style.display = "block"; notifyNew(); render(); }
  catch (e) { if (!lastOk && e.message !== "auth") showLogin(e.message); fresh(); }
}
function fresh() { const s = lastOk ? (Date.now() - lastOk) / 1000 : 999, ok = s < 10;
  $("#dot").className = "dot " + (ok ? "ok" : "bad"); $("#fresh").textContent = ok ? "en direct" : lastOk ? `hors ligne · ${s|0} s` : "connexion…"; }

async function notifyNew() {
  const all = ["spot", "perps"].flatMap(k => S.bots[k].trades).filter(t => new Date(t.created_at).getTime() > seen);
  if (!all.length) return;
  seen = Math.max(...all.map(t => new Date(t.created_at).getTime())); try { localStorage.setItem("pulse_seen", seen); } catch (e) {}
  for (const t of all.slice(0, 3)) {
    const act = (t.side || t.action || "").toUpperCase();
    const msg = `${{BUY: "ACHAT", SELL: "VENTE", OPEN: "OUVERTURE", CLOSE: "FERMETURE"}[act] || act} ${t.symbol || t.asset || ""}${t.pnl_usd != null ? " · " + sg(t.pnl_usd) + " $" : ""}`;
    if (document.hidden && "Notification" in window && Notification.permission === "granted") {
      const reg = await navigator.serviceWorker?.getRegistration(); reg?.showNotification("Pulse", {body: msg, icon: "icon-192.png"});
    } else toast(msg);
  }
}

const STATUS = {running: ["run", "En mission"], paused: ["pause", "En pause"], stopped: ["off", "Arrêté"], success: ["win", "Mission réussie"], destroyed: ["off", "Terminée"]};

/** Alertes : pilote sans stratégie, capital trop faible pour le nombre de positions. */
function alerts(kind, b) {
  const c = b.config || {}, sc = S.bots.spot.config || {}, out = [];
  const plans = kind === "spot" ? (c.plans || []) : (c.plans || []);
  if ((b.status === "running" || b.status === "paused") && c.autopilot && !plans.length)
    out.push(`Pilote automatique sans stratégie : aucune ne passe tes réglages, ce bot ne tradera pas.${sc.nerve === 3 ? " Ton réglage « Très nerveux » écarte toutes les stratégies lentes : essaie « Nerveux »." : sc.researchAggressive ? "" : " Le mode agressif des agents (Agents) accepterait plus de stratégies, mais moins sûres."}`);
  const v = Number(b.last_value_usd) - Number(b.vault || 0), n = c.maxPositions || 3;
  if (v > 0 && kind === "perps") {
    const min = S.rules.perps?.minCollateralUsd ?? 10, fit = Math.floor(v / min);
    if (fit < Math.min(n, Math.max(1, plans.length || 1))) out.push(fit < 1 ? `Capital trop faible : Jupiter exige ${min} $ de collatéral par position, il n'y a que ${nf(v)} $. Aucune position perps possible.` : `Capital : ${nf(v)} $ permet au plus ${fit} position(s) perps (${min} $ de collatéral minimum chacune), pas ${n}.`);
  }
  if (v > 0 && kind === "spot" && v / n < 4) out.push(`Capital faible : ${nf(v)} $ pour ${n} positions, soit ${nf(v / n)} $ chacune (ordre minimum 2 $). Réduis le nombre de positions dans Réglages → Protections, ou ajoute des USDC.`);
  return out.map(t => `<div class="warnbox" style="margin-top:10px">⚠ ${esc(t)}</div>`).join("");
}
function bilanCard() {
  const b = S.bilan; if (!b) return "";
  return `<div class="card" style="padding:10px 16px"><details data-d="bilan" style="margin:0"><summary>▸ BILAN DU SOIR · ${new Date(b.created_at).toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"}).toUpperCase()}</summary>
    <p class="sub" style="margin:8px 0 0;font-size:13px !important">${esc(b.detail)}</p></details></div>`;
}
/** Les deux sommes en haut de l'écran, d'un coup d'œil. */
function summary() {
  const tile = (k, label) => { const b = S.bots[k], [sc, st] = STATUS[b.status] || ["off", b.status];
    const v = b.last_value_usd, start = b.start_value_usd, g = v != null && start ? v - start : null;
    const pos = (b.positions || []).map(p => k === "perps" ? `${p.side === "short" ? "SHORT" : "LONG"} ${p.symbol}` : p.symbol).join(", ");
    return `<a href="#card-${k}"><div class="t"><span class="dot ${sc === "run" ? "ok" : sc === "pause" ? "warn" : ""}"></span>${label} · ${st}</div>
      <div class="n">${nf(v)} $</div><div class="k ${g == null ? "" : cl(g)}">${g == null ? "—" : `${sg(g)} $ (${sg(g / start * 100)} %)`}${pos ? ` · ${esc(pos)}` : ""}</div>${spark(b.curve)}</a>`; };
  const br = S.protections?.breakerTrippedAt ? `<div class="warnbox" style="margin-top:10px">⚠ Disjoncteur déclenché ${ago(new Date(S.protections.breakerTrippedAt).toISOString())} : les deux bots ont été arrêtés après une perte de plus de ${S.protections.breakerPct} %. Relance une mission quand tu es prêt.</div>` : "";
  return `<div class="sum">${tile("spot", "Bot 1")}${tile("perps", "Bot 2")}</div>${br}`;
}
/** Courbe du capital (mini graphique) : vert si au-dessus du point de départ, rouge sinon. */
function spark(c) {
  if (!c || c.length < 2) return `<div class="l2" style="margin-top:6px;font-size:11px">courbe dans 1 h</div>`;
  const W = 140, H = 34, vs = c.map(x => x.v), lo = Math.min(...vs), hi = Math.max(...vs), t0 = c[0].t, t1 = c.at(-1).t;
  const X = t => ((t - t0) / Math.max(1, t1 - t0) * W).toFixed(1), Y = v => (hi > lo ? H - 2 - (v - lo) / (hi - lo) * (H - 4) : H / 2).toFixed(1);
  const up = vs.at(-1) >= vs[0], col = up ? "var(--green)" : "var(--red)";
  const pts = c.map(x => `${X(x.t)},${Y(x.v)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;margin-top:6px">
    <polygon points="0,${H} ${pts} ${W},${H}" fill="${col}" opacity=".12"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>
    <div class="l2" style="font-size:10.5px;display:flex;justify-content:space-between"><span>${ago(new Date(t0).toISOString())}</span><span>${nf(lo)}–${nf(hi)} $</span></div>`;
}

function missionCard(kind, title) {
  const b = S.bots[kind], m = b.memory, br = b.brain, [sc, st] = STATUS[b.status] || ["off", b.status];
  const value = b.last_value_usd, start = b.start_value_usd, goal = b.goal_usd;
  const gain = value != null && start ? value - start : null;
  const prog = value != null && goal ? Math.min(100, value / goal * 100) : 0;
  const list = b.positions || [];
  const inPos = list.length > 0;
  const posBlock = p => {
    const cur = p.live?.price, entry = p.entry, stop = p.stop, side = p.side;
    const lo = Math.min(stop ?? entry, entry, cur ?? entry), hi = Math.max(stop ?? entry, entry, cur ?? entry, p.best ?? entry);
    const at = v => hi > lo ? ((v - lo) / (hi - lo) * 100).toFixed(1) : 50;
    return `<div class="sep"></div>
      <div class="grid g3" style="margin-top:0">
        <div><div class="k">Position</div><div class="v">${kind === "perps" ? (side === "short" ? "SHORT ▼ " : "LONG ▲ ") : ""}${esc(p.symbol)}${p.interval === "15m" ? ' <span class="mut" style="font-weight:400">15m</span>' : ""}</div></div>
        <div><div class="k">Résultat${kind === "perps" ? " (cours)" : ""}</div><div class="v ${cl(p.live?.pnlPct)}">${sg(p.live?.pnlPct)} %</div></div>
        <div><div class="k">Depuis</div><div class="v">${p.openedAt ? ago(new Date(p.openedAt).toISOString()) : "—"}</div></div>

        <div><div class="k">Cours</div><div class="v">${px(cur)} $</div></div>

      </div>
      ${stop && cur ? `<div class="range"><div class="t" style="${side === "short" ? "transform:scaleX(-1)" : ""}"></div><div class="e" style="left:${at(entry)}%"></div><div class="n" style="left:${at(cur)}%"></div></div>
      <div class="rl"><span>${side === "short" ? "meilleur" : "stop"} ${px(lo)}</span><span>${side === "short" ? "stop" : "meilleur"} ${px(hi)}</span></div>` : ""}`;
  };
  const pos = list.map(posBlock).join("");
  const running = b.status === "running", paused = b.status === "paused";
  const wallet = S.wallets[kind];
  return `<div class="eyebrow" id="card-${kind}">${title}</div>
  <div class="card">
    <div class="status ${sc}"><span class="dot ${sc === "run" ? "ok" : sc === "pause" ? "warn" : ""}"></span>${st}${m.pending ? ' <span class="pill">tx en cours</span>' : ""}</div>
    <div class="big">${nf(value)}<small>$</small></div>
    <div class="sub">sur un objectif de ${nf(goal, 0)} $${start ? ` · départ ${nf(start)} $` : ""}</div>
    <div class="bar"><i style="width:${prog}%"></i></div>
    <div class="grid">
      <div><div class="k">Gain</div><div class="v ${cl(gain)}">${gain == null ? "—" : `${sg(gain)} $<br>${sg(gain / start * 100)} %`}</div></div>
      <div><div class="k">Échéance</div><div class="v amber">${left(b.end_at)}</div></div>
      <div><div class="k">Contrôle</div><div class="v">${hhmm(b.last_tick_at)}</div></div>
      <div><div class="k">Risque</div><div class="v">${br ? nf(br.risk * 100, 1) + " %" : "—"}${br && br.streak ? ` <span class="${br.streak > 0 ? "up" : "down"}">${br.streak > 0 ? "▲" + br.streak : "▼" + -br.streak}</span>` : ""}</div></div>
    </div>
    ${alerts(kind, b)}
    ${b.vault ? `<div class="l2" style="margin-top:8px" data-tip="Coffre à gains : une part de chaque gain est mise de côté et n'est plus jamais retradée. Elle reste dans le wallet du bot, tu peux la retirer quand tu veux.">🔐 Coffre : <b>${nf(b.vault)} $</b> mis de côté, jamais retradés</div>` : ""}
    <div class="sep"></div>
    <div class="k">Dernière action</div><div class="v txt">${esc(b.last_message)}</div>
    ${pos}
    ${m.mindset || (!inPos && m.signal) ? `<details data-d="think-${kind}"><summary>▸ CE QUE PENSE LE BOT</summary>
      ${m.mindset ? `<div class="think">${esc(m.mindset)}</div>` : ""}
      ${!inPos && m.signal ? `<div class="k" style="margin-top:10px">Dernière analyse</div><div class="l2" style="line-height:1.5">${esc(m.signal)}</div>` : ""}</details>` : ""}
  </div>
  <div class="btns">

      <p class="sub" style="margin:12px 0 0">Dépose des USDC (Solana) + environ 0,03 SOL pour les frais. ${kind === "perps" ? "Minimum 10 $ d'USDC pour ouvrir une position." : ""}</p>`
      : `<p class="sub" style="margin:8px 0 0">Secret ${kind === "spot" ? "BOT_WALLET_PRIVATE_KEY" : "PERPS_WALLET_PRIVATE_KEY"} absent dans Supabase (Edge Functions → Secrets).</p>`}
  </details></div>`;
}

function modeText(i) {

function renderHist() {

        <div class="r">${amt != null ? nf(amt) + " $" : ""}${t.pnl_usd != null ? `<div class="${cl(t.pnl_usd)}">${sg(t.pnl_usd)} $</div>` : ""}

function explain(r) {
  const p = r.params || {}, iv = r.interval === "15m" ? "bougies de 15 minutes (scalping)" : "bougies d'une heure";
  const span = n => r.interval === "15m" ? `${n} bougies de 15 min (${nf(n / 4, n % 4 ? 1 : 0)} h)` : `${n} h`;
  if (r.family === "range") return `Range (marché sans tendance), sur ${iv}. Le bot trace des bandes de Bollinger autour de la moyenne des ${p.bbPeriod} dernières bougies (± ${String(p.bbK).replace(".", ",")} écart-type). Quand le prix sort sous la bande basse, il achète (long) ; au-dessus de la bande haute, il vend (short), en pariant sur le retour à la moyenne, qui est son objectif. Stop fixe à ${String(p.stopAtr).replace(".", ",")} ATR. Il ne le fait que si le marché n'est PAS en tendance (force < ${String(p.maxTrend).replace(".", ",")} ATR), et il sort si le retour n'arrive pas à temps.`;
  if (r.family === "rsi") return `Achat d'excès de baisse, sur ${iv}. Le bot achète quand le RSI(${p.rsiPeriod}), un indicateur de 0 à 100 qui mesure la force des derniers mouvements, descend sous ${p.entry} : le prix a chuté trop vite. Il n'achète que si la tendance de fond reste haussière (prix au-dessus de sa moyenne sur ${p.smaPeriod} bougies). Il revend quand le RSI repasse au-dessus de ${p.exit}. Stop de protection sous le plus bas des ${p.swingBars} dernières bougies.`;
  if (p.entry === "repli") return `Achat sur repli, sur ${iv}. Dans une tendance déjà en place (au moins ${String(p.minTrend).replace(".", ",")} fois la volatilité, ATR), le bot attend que le prix revienne toucher sa moyenne des 20 dernières bougies puis reparte dans le sens de la tendance : il ${r.kind === "perps" ? "achète (ou vend à découvert en tendance baissière)" : "achète"} à ce moment-là, à un meilleur prix qu'une cassure. Stop suiveur à ${String(p.trailAtr).replace(".", ",")} ATR du meilleur prix.`;
  return `Suivi de tendance, sur ${iv}. Le bot ${r.kind === "perps" ? "ouvre un long quand le prix casse son plus haut, ou un short quand il casse son plus bas," : "achète quand le prix casse son plus haut"} des ${span(p.breakout)}, seulement si la tendance est assez forte (au moins ${String(p.minTrend).replace(".", ",")} fois la volatilité moyenne, ATR). Il laisse courir le gain avec un stop suiveur placé à ${String(p.trailAtr).replace(".", ",")} ATR du meilleur prix : le stop monte avec le prix et ne redescend jamais.`;
}

        ${r.test.luck != null ? `<div data-tip="${TIPS.luck}"><div class="k">Part de chance</div><div class="v ${r.test.luck > 0.5 ? "down" : r.test.luck > 0.2 ? "amber" : "up"}">${nf(r.test.luck * 100, 0)} %</div></div>` : ""}
      </div>
      ${r.live ? `<div class="sep"></div><div class="k">En réel (trades des bots)</div><div class="v ${cl(r.live.pnlUsd)}" style="font-size:15px">${r.live.trades} trades · ${sg(r.live.pnlUsd)} $ · PF ${nf(r.live.profitFactor)}</div>` : ""}
      ${r.verdict === "déçue en réel" ? `<p class="sub" style="margin:8px 0 0">${esc(r.why)}</p>` : ""}
      <button class="btn sm" style="width:100%;margin-top:14px" data-apply="${r.id}" data-desc="${esc(r.description)}" data-kind="${r.kind}">${r.kind === "spot" ? "Ajouter au bot spot" : "Appliquer au bot perps"}</button></div>`).join("");
  el.innerHTML = `${mathCard()}${swapCard()}<div class="eyebrow">Le Chercheur</div>
    <div class="card"><div class="status run"><span class="dot ok"></span>Recherche en continu</div>
      <div class="big" style="font-size:40px">${AG ? nf(AG.tested, 0) : "…"}<small>stratégies testées</small></div>
      <div class="sub">Toutes les 5 minutes, il invente et teste de nouvelles stratégies, puis les juge sur 30 jours qu'il n'a jamais vus.${AG?.lastAt ? ` Dernière recherche il y a ${ago(AG.lastAt)}.` : ""}</div>
      <button class="btn sm" style="width:100%;margin-top:14px" id="agRun">${AG_BUSY ? "Recherche en cours…" : "Chercher maintenant"}</button></div>
    ${pilot}
    <div class="eyebrow">Ses meilleures découvertes</div>
    ${cards || `<div class="card"><p class="sub" style="margin:0">Aucune stratégie n'a encore passé la validation sur une période jamais vue. C'est normal au début : il faut quelques heures de recherche.</p></div>`}
    <div class="eyebrow">Parler au chercheur</div>
    <div class="card">
      <div id="chatLog">${CHAT.length ? CHAT.map(m => `<div class="bubble ${m.role === "user" ? "me" : "ai"}">${esc(m.content)}</div>`).join("") : `<div class="bubble ai">Salut Ramos. Pose-moi une question : « quelle est ta meilleure piste ? », « pourquoi le bot n'achète pas ? », « le mode agressif vaut le coup ? »…</div>`}
        ${AG_BUSY === "chat" ? `<div class="bubble ai">…</div>` : ""}</div>
      <div class="chatbox"><textarea id="chatIn" rows="1" placeholder="Écris ton message…">${esc(keepDraft)}</textarea><button class="btn go sm" id="chatSend" style="min-height:48px">Envoyer</button></div>
      ${CHAT.length ? `<button class="btn sm" style="margin-top:10px" id="chatClear">Effacer la discussion</button>` : ""}
      ${S?.secrets && !S.secrets.anthropic ? `<p class="sub" style="margin:12px 0 0;font-size:13px">Sans le secret ANTHROPIC_API_KEY dans Supabase, il ne peut que résumer ses résultats. Avec, il discute vraiment.</p>` : ""}
    </div>`;
}
async function sendChat() {
  const txt = $("#chatIn").value.trim(); if (!txt || AG_BUSY) return;
  CHAT.push({role: "user", content: txt}); $("#chatIn").value = ""; AG_BUSY = "chat"; renderAg();
  try { const r = await api("/api/agent/chat", {method: "POST", body: JSON.stringify({messages: CHAT})}); CHAT.push({role: "assistant", content: r.reply}); }
  catch (e) { CHAT.push({role: "assistant", content: "Je n'ai pas pu répondre : " + e.message}); }
  CHAT = CHAT.slice(-30); try { localStorage.setItem("pulse_chat", JSON.stringify(CHAT)); } catch (e) {}
  AG_BUSY = false; renderAg(); const log = $("#chatLog"); log?.lastElementChild?.scrollIntoView({block: "end"});
}

// ---------------------------------------------------------------- actions
document.addEventListener("click", async e => {
  const row = e.target.closest("[data-tr]");
  if (row && !e.target.closest("a")) { const [k, id] = row.dataset.tr.split(":"); const tr = S.bots[k].trades.find(x => String(x.id) === id); if (tr) whyTrade(tr, k); return; }
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast("Adresse copiée"); } catch (err) { toast("Copie impossible"); } return; }
  if (t.dataset.hf) { HF = t.dataset.hf; renderHist(); return; }
  if (t.dataset.pr) { document.querySelectorAll(`[data-pr="${t.dataset.pr}"]`).forEach(x => x.classList.toggle("on", x === t)); return; }
  if (t.id === "saveProt") { const v = g => +($(`[data-pr="${g}"].on`)?.dataset.v ?? 0);
    try { const r = await api("/api/protections", {method: "POST", body: JSON.stringify({
        spot: {maxPositions: v("sp-max"), vaultPct: v("sp-vault"), partialTp: $("#prSpPartial").checked, marketFilter: $("#prFilter").checked},
        perps: {maxPositions: v("pp-max"), vaultPct: v("pp-vault"), partialTp: $("#prPpPartial").checked}, breakerPct: v("breaker")})});
      toast(`Protections enregistrées · disjoncteur ${r.spot.breakerPct ? "−" + r.spot.breakerPct + " %" : "coupé"}`); } catch (e) {}
    await refresh(); renderSet(); return; }
  if (t.id === "chatSend") return sendChat();
  if (t.id === "agSave") { const aggressive = $("#agAggr").checked, nerve = +$("#agNerve").value; window.__agDraft = null;
    try { const r = await api("/api/research/settings", {method: "POST", body: JSON.stringify({aggressive, nerve})});
      toast(`Agents : ${r.aggressive ? "mode agressif" : "mode normal"} · ${AG?.settings?.levels?.[r.nerve] || ""}`); } catch (e) {}
    await refresh(); await loadAg(); return; }
  if (t.id === "swapRun") { if (SW_BUSY) return; SW_BUSY = true; renderAg();
    try { const r = await api("/api/agents/swap/run", {method: "POST"});
      const txt = ["spot", "perps"].map(k => typeof r[k] === "string" ? `${k} : ${r[k]}` : `${k} : ${r[k].vendus} vente(s), ${r[k].comptesFermes} compte(s) fermé(s), +${nf(r[k].solRecupere, 4)} SOL`).join(" · ");
      toast(txt); } catch (e) {}
    SW_BUSY = false; await loadAg(); return; }
  if (t.id === "chatClear") { CHAT = []; try { localStorage.removeItem("pulse_chat"); } catch (e) {} renderAg(); return; }
  if (t.id === "agRun") { if (AG_BUSY) return; AG_BUSY = true; renderAg();
    try { const r = await api("/api/research/run", {method: "POST"}); toast(`${r.tested} stratégies testées sur ${r.market}`); } catch (e) {}
    AG_BUSY = false; await loadAg(); return; }
  if (t.dataset.apply) { const id = t.dataset.apply, kind = t.dataset.kind;
    sheet(`<h3>Appliquer la stratégie #${esc(id)} ?</h3><p>${esc(t.dataset.desc)}</p><p>${kind === "spot" ? "Elle rejoint les plans du bot spot (3 maximum, une par token)." : "Elle remplace le plan du bot perps."} Une position déjà ouverte garde ses règles. Tu pourras revenir aux réglages automatiques à tout moment.</p>
      <div class="btns"><button class="btn" id="sheetCancel">Annuler</button><button class="btn go" data-doapply="${esc(id)}">Appliquer</button></div>`); return; }
  if (t.dataset.doapply) { closeSheet(); const r = await api("/api/research/apply", {method: "POST", body: JSON.stringify({id: +t.dataset.doapply})});
    toast(`Stratégie appliquée au bot ${r.kind}`); await refresh(); loadAg(); return; }
  if (t.dataset.auto) { for (const k of t.dataset.auto === "all" ? ["spot", "perps"] : [t.dataset.auto]) await api(`/api/${k}/config`, {method: "POST", body: JSON.stringify({trend: null})});
    toast("Retour aux réglages automatiques"); await refresh(); loadAg(); return; }
  if (t.dataset.strat) { document.querySelectorAll("[data-strat]").forEach(x => x.classList.toggle("on", x === t));
    $("#rsiFields").style.display = t.dataset.strat === "rsi" ? "" : "none"; $("#saveStrat").dataset.sel = t.dataset.strat; return; }
  if (t.dataset.lev && t.id !== "savePerps") {
    document.querySelectorAll(".chip[data-lev]").forEach(x => x.classList.toggle("on", x === t));
    $("#savePerps").dataset.lev = t.dataset.lev; $("#levTxt").textContent = levText(+t.dataset.lev); return; }
  if (t.id === "savePerps") {
    const r = await api("/api/perps/config", {method: "POST", body: JSON.stringify({aggr: +$("#paggr").value, maxLev: +t.dataset.lev, bias: +$("#pbias").value})});
    toast(`Perps : ${S.rules.aggrLevels[r.config.aggr].name} · levier max x${r.config.maxLev} · ${biasText(r.config.bias)}`); BT = null; await refresh(); renderSet(); return; }
  if (t.id === "saveStrat") {
    const body = {strategy: t.dataset.sel, rsi: {rsiPeriod: +$("#r-period").value, entry: +$("#r-entry").value, exit: +$("#r-exit").value,
      smaPeriod: +$("#r-sma").value, swingBars: +$("#r-swing").value, riskPct: +String($("#r-risk").value).replace(",", "."), naive: $("#r-naive").checked}};
    const r = await api("/api/spot/config", {method: "POST", body: JSON.stringify(body)});
    toast(r.config.strategy === "rsi" ? "Stratégie RSI enregistrée" : "Suivi de tendance enregistré"); BT = null; await refresh(); renderSet(); return; }
  if (t.id === "btRun") {
    BT = "loading"; renderBt(); const results = [];
    for (let i = 0; i < S.markets.length; i++) {
      try { results.push(await api(`/api/backtest?market=${i}`)); } catch (err) { results.push({market: S.markets[i], error: "indisponible"}); }
      BT = {results, partial: i < S.markets.length - 1}; renderBt();
    }
    return; }
  if (t.id === "notif") { if (!("Notification" in window)) return toast("Non supporté ici"); await Notification.requestPermission(); renderSet(); return; }
  if (t.id === "install") { if (window.__inst) { window.__inst.prompt(); window.__inst = null; } else toast("Menu ⋮ de Brave → « Ajouter à l'écran d'accueil »"); return; }
  if (t.id === "logout") { try { localStorage.removeItem("pulse_token"); } catch (err) {} location.reload(); return; }
  if (t.dataset.goal) { const k = t.dataset.goal;
    await api(`/api/${k}/goal`, {method: "POST", body: JSON.stringify({goal_usd: Number($("#goal-" + k).value), days: Number($("#days-" + k).value)})}); toast("Enregistré"); await refresh(); renderSet(); return; }
  if (t.id === "sheetCancel") return closeSheet();
  const k = t.dataset.k, act = t.dataset.act;
  if (act === "pause") { await api(`/api/${k}/pause`, {method: "POST"}); toast("En pause (la position reste gérée)"); refresh(); }
  if (act === "start") {
    const b = S.bots[k];
    if (b.status === "paused") { await api(`/api/${k}/start`, {method: "POST", body: "{}"}); toast("Mission reprise"); refresh(); return; }
    sheet(`<h3>Lancer la mission</h3><p>Le bot va trader avec les fonds du portefeuille ${k === "spot" ? "spot" : "perps"}.</p>
      <label class="field"><span>Objectif ($)</span><input type="number" id="sg" value="${b.goal_usd}"></label>
      <label class="field"><span>Échéance (jours)</span><input type="number" id="sd" value="30"></label>
      <div class="btns" style="margin-top:16px"><button class="btn" id="sheetCancel">Annuler</button><button class="btn go" data-act="go" data-k="${k}">Lancer</button></div>`);
  }
  if (act === "go") { await api(`/api/${k}/start`, {method: "POST", body: JSON.stringify({goal_usd: Number($("#sg").value), days: Number($("#sd").value)})}); closeSheet(); toast("Mission lancée"); refresh(); }
  if (act === "stop") sheet(`<h3>Arrêt d'urgence</h3><p>${k === "spot" ? "Tous les jetons seront revendus en USDC" : "La position perps sera fermée"} et le bot mis en pause.</p>
      <div class="btns"><button class="btn" id="sheetCancel">Annuler</button><button class="btn red" data-act="kill" data-k="${k}">Tout arrêter</button></div>`);
  if (act === "kill") { closeSheet(); toast("Fermeture en cours… (jusqu'à 1 min)"); try { await api(`/api/${k}/stop`, {method: "POST"}); toast("Arrêté"); } catch (err) {} refresh(); }
});

document.addEventListener("change", async e => {
  if (e.target.id === "agAggr") { window.__agDraft = {aggressive: e.target.checked, nerve: +$("#agNerve").value}; if (e.target.checked) toast("Mode agressif : pense à enregistrer"); return; }
  if (e.target.dataset?.swapauto) { await api("/api/agents/swap/auto", {method: "POST", body: JSON.stringify({on: e.target.checked})}); toast(e.target.checked ? "Nettoyage automatique activé" : "Nettoyage automatique coupé"); return loadAg(); }
  const k = e.target.dataset?.pilot; if (!k) return;
  const on = e.target.checked;
  try { const r = await api("/api/autopilot", {method: "POST", body: JSON.stringify({[k]: on})});
    toast(on ? `Pilote automatique activé (${k}) : ${r.pilot}` : `Pilote automatique coupé (${k})`); } catch (err) { e.target.checked = !on; }
  await refresh(); loadAg();
});
document.addEventListener("input", e => { if (e.target.id === "pbias") $("#pbiasTxt").textContent = biasText(+e.target.value);
  if (e.target.id === "agNerve" || e.target.id === "agAggr") window.__agDraft = {aggressive: $("#agAggr").checked, nerve: +$("#agNerve").value};
  if (e.target.id === "agNerve") { $("#agNerveName").textContent = (AG?.settings?.levels || [])[+e.target.value] || ""; $("#agNerveTxt").textContent = window.__nerveTxt?.(+e.target.value) || ""; }
  if (e.target.id === "paggr") { $("#paggrName").textContent = S.rules.aggrLevels[+e.target.value].name; $("#pmodeTxt").textContent = modeText(+e.target.value); } });
setInterval(() => { if (PAGE === "ag" && !document.hidden && !AG_BUSY) loadAg(); }, 60000);
document.addEventListener("keydown", e => { if (e.target.id === "chatIn" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } });
addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__inst = e; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
if (!TOKEN || !BASE) showLogin(); else refresh();
setInterval(() => { if (!lastOk) return; if (!document.hidden && !$("#sheet").classList.contains("on")) refresh(); else fresh(); }, 5000);
}
</script>
</body>
</html>
